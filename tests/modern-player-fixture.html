<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bandcamp modern player fixture</title>
  <style>
    body { background: #f6f6f6; color: #222; font-family: Arial, sans-serif; min-height: 100vh; }
    .floating-player { bottom: 0; left: 0; position: fixed; right: 0; }
    .tracks { display: none; }
  </style>
</head>
<body>
  <main><h1>Home / Discover player fixture</h1></main>
  <section class="floating-player has-track">
    <ol class="tracks">
      <li class="track-list-item currently-playing">
        <div class="meta-wrapper-wide">
          <div class="track-meta" id="modern-1" duration="180" streamurl="https://t4.bcbits.com/stream/modern-one/mp3-128/1">
            <img src="/tests/fixtures/assets/art-clouds.png" alt="">
            <a class="meta" href="https://fixture-artist.bandcamp.com/track/modern-one">
              <span class="title-text">Modern One</span><span class="artist-name">by Fixture Artist</span>
            </a>
          </div>
        </div>
      </li>
      <li class="track-list-item">
        <div class="meta-wrapper-wide">
          <div class="track-meta" id="modern-2" duration="210" streamurl="https://t4.bcbits.com/stream/modern-two/mp3-128/2">
            <img src="/tests/fixtures/assets/art-cobrastyle.png" alt="">
            <a class="meta" href="https://fixture-artist.bandcamp.com/album/modern-two-release">
              <span class="title-text">Modern Two</span><span class="artist-name">by Fixture Artist</span>
            </a>
          </div>
        </div>
      </li>
    </ol>
    <button class="play-pause-button outline" tracklistkey="discover:test" aria-label="Pause">Pause</button>
    <button class="prev-track" aria-label="Skip to previous song">Previous</button>
    <button class="next-track" aria-label="Skip to next song">Next</button>
    <input type="range" min="0" max="180" value="24">
    <div class="dialog-container"><div class="player-dialog">Native Now Playing</div></div>
  </section>
  <script>
    const nativeModernControl = document.querySelector(".floating-player .play-pause-button");
    let playlistPageControl = null;
    let homepagePlaylistControl = null;
    if (location.search.includes("playlist-dialog-actions")) {
      const dialog = document.querySelector(".floating-player .player-dialog");
      const tracks = document.querySelector(".floating-player .tracks");
      dialog.replaceChildren(tracks);
      tracks.style.display = "block";
      const dialogStyle = document.createElement("style");
      dialogStyle.textContent = `
        .floating-player { display: block !important; position: relative; }
        .player-dialog { display: block; padding: 16px; width: 520px; }
        .track-list-item { display: block; height: 72px; }
        .meta-wrapper-wide, .track-meta { height: 72px; width: 360px; }
        .track-meta { align-items: center; display: flex; gap: 8px; }
        .track-meta img { flex: 0 0 56px; height: 56px; object-fit: cover; width: 56px; }
        .track-meta .meta { display: block; flex: 0 1 auto; }
      `;
      document.head.append(dialogStyle);
    }
    if (location.search.includes("playlist-page")) {
      document.querySelector(".floating-player").classList.remove("has-track");
      nativeModernControl.setAttribute("tracklistkey", "playlist:745156");
      nativeModernControl.setAttribute("aria-label", "Play");
      nativeModernControl.textContent = "Play";
      const playlistTracks = [
        { id: "modern-1", title: "Modern One", artistName: "Fixture Artist", bandUrl: "https://fixture-artist.bandcamp.com/", duration: 180, artId: 101, url: "https://fixture-artist.bandcamp.com/track/modern-one", streamUrl: "https://t4.bcbits.com/stream/modern-one/mp3-128/1" },
        { id: "modern-2", title: "Modern Two", artistName: "Fixture Artist", bandUrl: "https://fixture-artist.bandcamp.com/", duration: 210, artId: 102, url: "https://fixture-artist.bandcamp.com/track/modern-two", streamUrl: "https://t4.bcbits.com/stream/modern-two/mp3-128/2" }
      ];
      const page = document.querySelector("main");
      page.id = "PlaylistPage";
      page.setAttribute("data-blob", JSON.stringify({ appData: {
        playlistId: 745156,
        title: "Fixture playlist",
        tracklist: { itemType: "playlist", itemId: 745156, title: "Fixture playlist", tracks: playlistTracks, nextCursor: 1, tracksSummary: { totalCount: 3, totalDuration: 600 } }
      } }));
      [...document.querySelectorAll(".track-list-item")].forEach((row, index) => {
        const rowControl = document.createElement("button");
        rowControl.className = "play-pause-button over-image";
        rowControl.setAttribute("tracklistkey", "playlist:745156");
        rowControl.setAttribute("trackindex", String(index));
        rowControl.setAttribute("aria-label", "Play");
        rowControl.textContent = `Play track ${index + 1}`;
        row.prepend(rowControl);
      });
      playlistPageControl = document.createElement("button");
      playlistPageControl.className = "play-pause-button outline-opaque";
      playlistPageControl.setAttribute("tracklistkey", "playlist:745156");
      playlistPageControl.setAttribute("aria-label", "Play");
      playlistPageControl.textContent = "Play playlist";
      page.append(playlistPageControl);
    }
    nativeModernControl.addEventListener("click", () => {
      const count = Number(document.documentElement.dataset.nativePlayerClicks || 0) + 1;
      document.documentElement.dataset.nativePlayerClicks = String(count);
      if (!location.search.includes("rapid-switch")) {
        const playing = nativeModernControl.getAttribute("aria-label") === "Pause";
        nativeModernControl.setAttribute("aria-label", playing ? "Play" : "Pause");
        nativeModernControl.textContent = playing ? "Play" : "Pause";
      }
    });
    if (location.search.includes("home-source-metadata")) {
      for (const link of document.querySelectorAll(".floating-player .track-meta a.meta")) {
        const copy = document.createElement("span");
        copy.className = link.className;
        copy.append(...link.childNodes);
        link.replaceWith(copy);
      }
      document.querySelector("main")?.insertAdjacentHTML("beforeend", `
        <article class="carousel-item" data-item-json='{"item_title":"Fixture Home Album","item_url":"https://fixture-artist.bandcamp.com/album/fixture-home-album"}'>
          <a href="https://fixture-artist.bandcamp.com/album/fixture-home-album">Fixture Home Album</a>
          <button class="play-pause-button" tracklistkey="discover:test" type="button">Play album</button>
        </article>`);
    }
    if (location.search.includes("homepage-playlist-links")) {
      document.querySelector(".floating-player").classList.remove("has-track");
      nativeModernControl.setAttribute("aria-label", "Play");
      nativeModernControl.textContent = "Play";
      for (const link of document.querySelectorAll(".floating-player .track-meta a.meta")) {
        const copy = document.createElement("span");
        copy.className = link.className;
        copy.dataset.pageUrl = link.href;
        copy.dataset.artistUrl = `${new URL(link.href).origin}/`;
        copy.append(...link.childNodes);
        link.replaceWith(copy);
      }
      document.querySelector("main")?.insertAdjacentHTML("beforeend", `
        <article class="carousel-item">
          <a href="https://bandcamp.com/fixture-fan/playlist/fixture-playlist">Fixture fan playlist</a>
          <button class="play-pause-button" tracklistkey="discover:test" type="button">Play playlist</button>
        </article>`);
      homepagePlaylistControl = document.querySelector("main .carousel-item .play-pause-button");
      homepagePlaylistControl.addEventListener("click", () => {
        document.querySelector(".floating-player").classList.add("has-track");
        nativeModernControl.setAttribute("aria-label", "Pause");
        nativeModernControl.textContent = "Pause";
        window.setTimeout(() => {
          for (const copy of document.querySelectorAll(".floating-player .track-meta span.meta[data-page-url]")) {
            const titleLink = document.createElement("a");
            titleLink.className = "item-link";
            titleLink.href = copy.dataset.pageUrl;
            titleLink.append(copy.querySelector(".title-text"));
            const artistLink = document.createElement("a");
            artistLink.className = "artist-link";
            artistLink.href = copy.dataset.artistUrl;
            artistLink.append(copy.querySelector(".artist-name"));
            copy.replaceWith(titleLink, artistLink);
          }
        }, 260);
      });
    }
    window.fixtureDownloads = [];
    window.confirm = () => true;
    URL.createObjectURL = (blob) => {
      window.fixtureDownloads.push({ blob, filename: "" });
      return `blob:fixture-${window.fixtureDownloads.length}`;
    };
    URL.revokeObjectURL = () => {};
    const fixtureAnchorClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function () {
      if (this.download) {
        window.fixtureDownloads.at(-1).filename = this.download;
        return;
      }
      fixtureAnchorClick.call(this);
    };
    window.fixtureStored = location.search.includes("saved-playlists") ? {
      bandcampHubState: {
        open: true,
        activeTab: "playlist",
        playlistView: "saved",
        playlist: [
          { playlistItemId: "playlist-modern-one", id: "modern-1", title: "Modern One", artist: "Fixture Artist", album: "Fixture release", pageUrl: "https://fixture-artist.bandcamp.com/track/modern-one", artistUrl: "https://fixture-artist.bandcamp.com/", duration: 180, url: "https://t4.bcbits.com/stream/modern-one/mp3-128/1" }
        ],
        savedPlaylists: [{
          id: "saved-fixture-set",
          name: "Fixture set",
          savedAt: "2026-08-04T10:00:00.000Z",
          items: [
            { playlistItemId: "playlist-modern-one", id: "modern-1", title: "Modern One", artist: "Fixture Artist", album: "Fixture release", art: "http://127.0.0.1:8765/tests/fixtures/assets/art-clouds.png", pageUrl: "https://fixture-artist.bandcamp.com/track/modern-one", artistUrl: "https://fixture-artist.bandcamp.com/", duration: 180, url: "https://t4.bcbits.com/stream/modern-one/mp3-128/1" },
            { playlistItemId: "playlist-modern-two", id: "modern-2", title: "Modern Two", artist: "Fixture Artist", album: "Fixture release", art: "http://127.0.0.1:8765/tests/fixtures/assets/art-cobrastyle.png", pageUrl: "https://fixture-artist.bandcamp.com/album/modern-two-release", artistUrl: "https://fixture-artist.bandcamp.com/", duration: 210, url: "https://t4.bcbits.com/stream/modern-two/mp3-128/2" }
          ]
        }]
      }
    } : {};
    if (location.search.includes("playlist-page-track")) {
      window.fixtureStored = { bandcampHubState: {
        open: true,
        activeTab: "nowPlaying",
        playlistMode: "manual",
        playlist: [{ playlistItemId: "old-manual", id: "old-manual", title: "Old Manual Track", artist: "Fixture", pageUrl: "https://fixture.bandcamp.com/track/old-manual", duration: 120, url: "https://t4.bcbits.com/stream/old-manual/mp3-128/90" }]
      } };
    }
    if (location.search.includes("saved-playlists-metadata")) {
      for (const item of window.fixtureStored.bandcampHubState.savedPlaylists[0].items) {
        item.artist = "Bandcamp";
        item.art = "";
      }
    }
    if (location.search.includes("playlist-reorder") || location.search.includes("active-playlist") || location.search.includes("playlist-analysis-metadata")) {
      window.fixtureStored = {
        bandcampHubState: {
          open: true,
          activeTab: "playlist",
          playlistView: "current",
          playlistMode: "manual",
          playlist: [
            { playlistItemId: "playlist-modern-one", id: "modern-1", title: "Modern One", artist: "Fixture Artist", pageUrl: "https://fixture-artist.bandcamp.com/track/modern-one", duration: 180, url: "https://t4.bcbits.com/stream/modern-one/mp3-128/1" },
            { playlistItemId: "playlist-modern-two", id: "modern-2", title: "Modern Two", artist: "Fixture Artist", pageUrl: "https://fixture-artist.bandcamp.com/album/modern-two-release", duration: 210, url: "https://t4.bcbits.com/stream/modern-two/mp3-128/2" }
          ],
          savedPlaylists: []
        }
      };
      if (location.search.includes("playlist-analysis-metadata")) {
        window.fixtureStored.bandcampHubState.playlist[0].album = "Fixture Artist - Fixture Album";
      }
    }
    if (location.search.includes("appearance-reskin")) {
      window.fixtureStored = { bandcampHubState: {
        open: true,
        activeTab: "settings",
        appearance: { pageAware: false, applyToPage: true, preset: "midnight", savedThemes: [] }
      } };
    }
    window.fixtureMessages = [];
    window.fixturePlaybackState = null;
    const fixtureChrome = {
      runtime: {
        lastError: null,
        getURL: (path) => new URL(`/dist/unpacked/${path}`, location.href).href,
        getManifest: () => ({ version: "0.5.14" }),
        sendMessage(message, callback) {
          window.fixtureMessages.push(structuredClone(message));
          if (message.type === "BANDCAMP_HUB_GET_SEAMLESS_STATE") callback?.({ ok: true, state: location.search.includes("active-playlist") || location.search.includes("playlist-analysis-metadata") ? {
            enabled: true, status: "playing", isPlaying: true, currentTime: 24, duration: 180, progress: 24 / 180,
            rate: 1, preservePitch: true, index: 0,
            ...(location.search.includes("playlist-analysis-metadata") ? {
              detectedBpm: 124,
              automaticBpm: 124,
              detectedKey: { camelot: "8A", shortName: "A min", name: "A minor" }
            } : {}),
            track: window.fixtureStored.bandcampHubState.playlist[0],
            queue: window.fixtureStored.bandcampHubState.playlist
          } : { enabled: false, status: "idle" } });
          else if (message.type === "BANDCAMP_HUB_RESOLVE_PLAYLIST_ITEMS") {
            if (location.search.includes("saved-playlists-metadata")) {
              callback?.({ ok: true, items: message.items.map((item, index) => ({
                ...item,
                artist: "Repaired Artist",
                art: index
                  ? "http://127.0.0.1:8765/tests/fixtures/assets/art-cobrastyle.png"
                  : "http://127.0.0.1:8765/tests/fixtures/assets/art-clouds.png"
              })) });
            } else if (location.search.includes("rapid-switch")) {
              window.setTimeout(() => callback?.({ ok: true, items: message.items }), message.items[0]?.title === "Modern One" ? 220 : 20);
            } else callback?.({ ok: true, items: message.items });
          }
          else if (message.type === "BANDCAMP_HUB_SEAMLESS_ENABLE") {
            window.fixturePlaybackState = {
              enabled: true, status: "playing", isPlaying: true, currentTime: message.currentTime || 0,
              duration: message.queue[message.index].duration, progress: (message.currentTime || 0) / message.queue[message.index].duration,
              rate: message.rate, preservePitch: message.preservePitch, index: message.index,
              track: message.queue[message.index], queue: message.queue, detectedBpm: 120, bpmStatus: "ready"
            };
            callback?.({ ok: true, state: window.fixturePlaybackState });
          } else if (message.type === "BANDCAMP_HUB_SEAMLESS_PLAY_INDEX") {
            const index = Math.max(0, Math.min((window.fixturePlaybackState?.queue?.length || 1) - 1, Number(message.index) || 0));
            const track = window.fixturePlaybackState?.queue?.[index];
            window.fixturePlaybackState = {
              ...window.fixturePlaybackState,
              enabled: true,
              status: "playing",
              isPlaying: true,
              currentTime: 0,
              duration: track?.duration || 0,
              progress: 0,
              index,
              track
            };
            callback?.({ ok: true, state: window.fixturePlaybackState });
          } else if (message.type === "BANDCAMP_HUB_SEAMLESS_SEEK") {
            document.documentElement.dataset.lastSeek = String(message.currentTime);
            window.fixturePlaybackState = {
              ...window.fixturePlaybackState,
              currentTime: message.currentTime,
              progress: message.currentTime / window.fixturePlaybackState.duration
            };
            callback?.({ ok: true, state: window.fixturePlaybackState });
          }
          else callback?.({ ok: true });
        },
        onMessage: { addListener() {} }
      },
      storage: {
        local: {
          get(_key, callback) { callback(window.fixtureStored); },
          set(values) { Object.assign(window.fixtureStored, values); }
        }
      }
    };
    const fixtureFetch = window.fetch.bind(window);
    window.fetch = (input, init) => {
      const url = new URL(typeof input === "string" ? input : input.url, location.href);
      if (url.pathname === "/api/player/2/player_data_web") {
        const apiResponse = new Response(JSON.stringify({ tracklist: {
          tracks: [{ id: "modern-3", title: "Modern Three", artistName: "Fixture Artist", bandUrl: "https://fixture-artist.bandcamp.com/", duration: 210, artId: 103, url: "https://fixture-artist.bandcamp.com/track/modern-three", streamUrl: "https://t4.bcbits.com/stream/modern-three/mp3-128/3" }],
          nextCursor: null
        } }), { status: 200, headers: { "Content-Type": "application/json" } });
        return location.search.includes("playlist-page-rapid")
          ? new Promise((resolve) => window.setTimeout(() => resolve(apiResponse), 180))
          : Promise.resolve(apiResponse);
      }
      return fixtureFetch(input, init);
    };
    fetch(`/dist/unpacked/cart-autosave.js${location.search}`).then((response) => response.text()).then((source) => eval(source)).then(() => fetch(`/dist/unpacked/content.js${location.search}`)).then((response) => response.text()).then((source) => {
      eval(source.replaceAll("chrome.", "fixtureChrome."));
      if (location.search.includes("playlist-page-rapid")) {
        playlistPageControl.click();
        window.setTimeout(() => document.querySelector('.track-list-item:nth-child(2) .play-pause-button[trackindex="1"]').click(), 90);
      }
      else if (location.search.includes("playlist-page-track")) document.querySelector('.track-list-item:nth-child(2) .play-pause-button[trackindex="1"]').click();
      else if (location.search.includes("playlist-page")) playlistPageControl.click();
      if (location.search.includes("homepage-playlist-links")) homepagePlaylistControl.click();
      if (location.search.includes("rapid-switch")) {
        window.setTimeout(() => {
          const tracks = document.querySelectorAll(".track-list-item");
          tracks[0].classList.remove("currently-playing");
          tracks[1].classList.add("currently-playing");
          nativeModernControl.setAttribute("trackindex", "1");
          nativeModernControl.click();
        }, 20);
        if (location.search.includes("rapid-switch-back")) {
          window.setTimeout(() => {
            const tracks = document.querySelectorAll(".track-list-item");
            tracks[1].classList.remove("currently-playing");
            tracks[0].classList.add("currently-playing");
            nativeModernControl.setAttribute("trackindex", "0");
            nativeModernControl.click();
          }, 40);
        }
        window.setTimeout(() => {
          const enabledMessages = window.fixtureMessages.filter((message) => message.type === "BANDCAMP_HUB_SEAMLESS_ENABLE");
          const switchMessages = window.fixtureMessages.filter((message) => message.type === "BANDCAMP_HUB_SEAMLESS_PLAY_INDEX");
          const expectedTitle = location.search.includes("rapid-switch-back") ? "Modern One" : "Modern Two";
          document.title = enabledMessages.length === 1
            && switchMessages.length === 0
            && window.fixturePlaybackState?.track?.title === expectedTitle
            && window.fixtureStored.bandcampHubState?.playlist?.length === 1
            && window.fixtureStored.bandcampHubState.playlist[0]?.title === expectedTitle
            && window.fixtureStored.bandcampHubState.playlistMode === "browse"
            ? `PASS: rapid Home switch keeps ${expectedTitle} request fixture`
            : `FAIL: rapid Home switch ${expectedTitle}/${enabledMessages.length}/${switchMessages.length}/${window.fixturePlaybackState?.track?.title || "none"}`;
        }, 700);
      }
    }).catch((error) => { document.documentElement.dataset.fixtureError = String(error); });
    window.setTimeout(async () => {
      const root = document.querySelector("#bandcamp-hub-extension-root")?.querySelector("[data-bandcamp-hub]")?.shadowRoot;
      if (location.search.includes("rapid-switch")) return;
      if (location.search.includes("playlist-dialog-actions")) {
        const buttons = [...document.querySelectorAll(".player-dialog .meta-wrapper-wide .bandcamp-hub-page-playlist")];
        const buttonLefts = buttons.map((button) => Math.round(button.getBoundingClientRect().left));
        document.title = buttons.length === 2
          && buttons.every((button) => button.classList.contains("is-modern-player-track-action"))
          && buttons.every((button) => getComputedStyle(button).width === "24px"
            && getComputedStyle(button).height === "24px"
            && getComputedStyle(button).borderRadius === "4px"
            && getComputedStyle(button).marginTop === "0px")
          && new Set(buttonLefts).size === 1
          ? "PASS: playlist dialog add controls fixture"
          : `FAIL: playlist dialog add controls ${buttons.length}/${buttonLefts.join(",")}`;
        return;
      }
      if (location.search.includes("homepage-playlist-links")) {
        const enabledMessages = window.fixtureMessages.filter((message) => message.type === "BANDCAMP_HUB_SEAMLESS_ENABLE");
        const titleLink = root?.querySelector(".hub-player-title");
        const artistLink = root?.querySelector(".hub-player-artist");
        document.title = enabledMessages.length === 1
          && enabledMessages[0].queue.length === 2
          && enabledMessages[0].queue.every((track) => /fixture-artist\.bandcamp\.com\/(?:album|track)\//.test(track.pageUrl))
          && titleLink?.href === "https://fixture-artist.bandcamp.com/track/modern-one"
          && artistLink?.href === "https://fixture-artist.bandcamp.com/"
          ? "PASS: staged Home playlist track and artist links fixture"
          : `FAIL: staged Home playlist links ${enabledMessages.length}/${titleLink?.href || "missing"}/${artistLink?.href || "missing"}`;
        return;
      }
      if (location.search.includes("playlist-page")) {
        const enabledMessages = window.fixtureMessages.filter((message) => message.type === "BANDCAMP_HUB_SEAMLESS_ENABLE");
        const titleLink = root?.querySelector(".hub-player-title");
        const requestedTrack = location.search.includes("playlist-page-track") || location.search.includes("playlist-page-rapid") ? "Modern Two" : "Modern One";
        const expectedQueueLength = requestedTrack === "Modern Two" ? 2 : 3;
        document.title = enabledMessages.length === 1
          && enabledMessages[0].queue.length === expectedQueueLength
          && window.fixturePlaybackState?.track?.title === requestedTrack
          && titleLink?.textContent === requestedTrack
          && titleLink?.href.includes(`fixture-artist.bandcamp.com/track/modern-${requestedTrack === "Modern One" ? "one" : "two"}`)
          && !window.fixtureStored.bandcampHubState?.playlist?.some((track) => track.title === "Old Manual Track")
          && window.fixtureStored.bandcampHubState?.playlistMode === "browse"
          ? `PASS: playlist page ${requestedTrack} playback handoff fixture`
          : `FAIL: playlist page handoff ${enabledMessages.length}/${enabledMessages[0]?.queue?.length || 0}/${window.fixturePlaybackState?.track?.title || "none"}/${titleLink?.textContent || "missing"}/${window.fixtureStored.bandcampHubState?.playlist?.map((track) => track.title).join(",") || "empty"}`;
        return;
      }
      if (location.search.includes("home-source-metadata")) {
        const titleLink = root?.querySelector(".hub-player-title");
        document.title = titleLink?.textContent === "Modern One"
          && titleLink?.href.includes("fixture-artist.bandcamp.com/album/fixture-home-album")
          ? "PASS: Home player source metadata fixture"
          : `FAIL: Home player source metadata ${titleLink?.textContent || "missing"}/${titleLink?.href || "missing"}`;
        return;
      }
      if (location.search.includes("appearance-reskin")) {
        const selectedTheme = root?.querySelector(".hub-theme-combobox");
        const themeOptions = [...(root?.querySelectorAll(".hub-theme-option") || [])];
        const customTheme = themeOptions.find((option) => option.dataset.themeId === "custom");
        const modeButtons = [...(root?.querySelectorAll(".hub-settings-segment") || [])];
        const themeMode = modeButtons.find((button) => button.dataset.appearanceMode === "theme");
        const matchMode = modeButtons.find((button) => button.dataset.appearanceMode === "match");
        const musicBarRow = root?.querySelector(".hub-settings-combined-row");
        const cartToggles = root?.querySelectorAll(".hub-hide-cart-toggle");
        matchMode?.click();
        const themeControlsHiddenWhenMatching = !root?.querySelector(".hub-theme-picker")
          && window.fixtureStored.bandcampHubState?.appearance?.pageAware === true
          && window.fixtureStored.bandcampHubState?.appearance?.applyToPage === false;
        root?.querySelector('[data-appearance-mode="theme"]')?.click();
        const themeControlsRestored = Boolean(root?.querySelector(".hub-theme-picker"))
          && window.fixtureStored.bandcampHubState?.appearance?.pageAware === false
          && window.fixtureStored.bandcampHubState?.appearance?.applyToPage === true;
        document.title = document.documentElement.dataset.bandkitPageTheme === "true"
          && getComputedStyle(document.body).backgroundColor === "rgb(13, 13, 18)"
          && getComputedStyle(document.querySelector("section.floating-player")).backgroundColor === "rgb(40, 40, 47)"
