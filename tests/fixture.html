<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BandKit DJ fixture</title>
  <style>
    body { background: #171c22; color: #d9e5ee; font-family: Arial, sans-serif; margin: 0; min-height: 100vh; }
    .menu-items { align-items: center; display: flex; height: 53px; justify-content: flex-end; list-style: none; margin: 0; padding: 0 24px; }
    #pgBd { margin: 80px auto; max-width: 700px; }
    a, .primaryText { color: #f2a64a; }
    .secondaryText { color: #94a8b6; }
    .inline_player { padding: 24px; }
    .track_row_view { align-items: center; display: grid; grid-template-columns: 1fr auto; min-height: 44px; }
    .track-row-actions { display: flex; gap: 14px; }
    .track_row_view .buy-link { opacity: 0; }
    .track_row_view:hover .buy-link, .track_row_view:focus-within .buy-link { opacity: 1; }
  </style>
</head>
<body>
  <ul class="page-wrapper menu-items" role="menubar" aria-label="Main menu"><li class="feed" role="none"><a href="/feed" aria-label="Feed" role="menuitem">Feed</a></li><li><button id="fixture-header-cart" type="button" aria-label="Shopping cart">Cart</button></li></ul>
  <main id="pgBd">
    <h1 class="primaryText">DJ tools test page</h1>
    <p class="secondaryText">Dark artist theme fixture</p>
    <div class="inline_player">
      <span class="title">Fixture Track</span>
      <span class="time"><span class="time_elapsed">0:00</span> / <span class="time_total">3:00</span></span>
      <div class="progbar"><div class="progbar_fill" style="width:0%"></div><div class="thumb" style="left:0%"></div></div>
      <button class="fixture-native-play" type="button" aria-label="Play">
        <span class="playbutton paused"><span class="play_status paused"></span></span>
      </button>
      <audio></audio>
    </div>
    <button id="buyItem" type="button">Buy Digital Album</button>
    <div class="fixture-track-list" hidden>
      <div class="track_row_view" rel="tracknum=1"><span class="play_status"></span><a class="track-title" href="https://fixture-artist.bandcamp.com/track/fixture-track">Fixture Track</a><span class="track-row-actions"><a class="buy-link" href="#buy-one">buy track</a></span></div>
      <div class="track_row_view" rel="tracknum=2"><span class="play_status"></span><a class="track-title" href="https://fixture-artist.bandcamp.com/track/next-fixture-track">Next Fixture Track</a><span class="track-row-actions"><a class="buy-link" href="#buy-two">buy track</a></span></div>
    </div>
    <script data-tralbum='{"artist":"Fixture Artist","trackinfo":[{"track_id":1,"title":"Fixture Track"},{"track_id":2,"title":"Next Fixture Track"}]}' data-embed='{"artist":"Fixture Artist"}'></script>
  </main>
  <script>
    window.fixtureDownloads = [];
    window.fixtureShares = [];
    if (location.search.includes("cart-roundtrip")) {
      Object.defineProperty(navigator, "canShare", { configurable: true, value: ({ files }) => files?.[0]?.type === "text/html" });
      Object.defineProperty(navigator, "share", { configurable: true, value: async (data) => { window.fixtureShares.push(data); } });
    }
    window.fixturePurchaseClicks = 0;
    if (location.search.includes("queue-single-card-controls")) {
      const fixtureHeader = document.createElement("header");
      fixtureHeader.className = "fixture-stacking-header";
      fixtureHeader.style.cssText = "left:0;position:fixed;right:0;top:0;z-index:100!important";
      const fixtureMenu = document.querySelector(".menu-items");
      fixtureMenu.before(fixtureHeader);
      fixtureHeader.append(fixtureMenu);
      const fixtureSticky = document.createElement("div");
      fixtureSticky.className = "sticky stuck fixture-overlapping-sidebar";
      fixtureSticky.style.cssText = "background:transparent;height:100vh;pointer-events:auto;position:fixed;right:0;top:0;width:300px;z-index:100";
      document.body.append(fixtureSticky);
    }
    document.querySelector("#buyItem")?.addEventListener("click", () => { window.fixturePurchaseClicks += 1; });
    if (location.search.includes("page-footer-space")) {
      const pageWrapper = document.createElement("div");
      pageWrapper.id = "propOpenWrapper";
      const pageBody = document.querySelector("#pgBd");
      pageBody.before(pageWrapper);
      pageWrapper.append(pageBody);
      const classicFooter = document.createElement("div");
      classicFooter.id = "pgFt";
      classicFooter.textContent = "Bandcamp footer";
      const pageFooter = document.createElement("page-footer");
      pageFooter.textContent = "Bandcamp logo";
      pageWrapper.append(classicFooter, pageFooter);
    }
    if (location.search.includes("header-shadow-cart")) {
      const menuBar = document.createElement("menu-bar");
      const menuShadow = menuBar.attachShadow({ mode: "open" });
      menuShadow.innerHTML = `<style>li.cart,li.cart[hidden],button[aria-label="Cart"],button[aria-label="Cart"][hidden]{display:flex!important}</style><ul><li class="cart"><button type="button" aria-label="Cart"><span>3</span></button></li></ul>`;
      document.body.prepend(menuBar);
      window.fixtureMenuShadow = menuShadow;
    }
    window.fixtureStored = (location.search.includes("cart-ui") || location.search.includes("cart-roundtrip")) ? {
      bandcampHubState: {
        open: true,
        activeTab: "cart",
        cartView: "saved",
        selectedSavedCartId: null,
        cartSummary: { subtotal: 35.87, currency: "USD" },
        cart: [
          { id: "live-1", title: "USD Fixture Album", artist: "Fixture Artist", kind: "Digital album", price: 9, currency: "USD", art: "/assets/art-clouds.png", url: "https://fixture.bandcamp.com/album/usd" },
          { id: "live-2", title: "GBP Fixture Album", artist: "Fixture Artist", kind: "Digital album", price: 12, currency: "GBP", art: "/assets/art-meridian.png", url: "https://fixture.bandcamp.com/album/gbp-one" },
          { id: "live-3", title: "Another GBP Album", artist: "Fixture Artist", kind: "Digital album", price: 8, currency: "GBP", art: "/assets/art-velocity.png", url: "https://fixture.bandcamp.com/album/gbp-two" }
        ],
        savedCarts: [{
          id: "saved-fixture",
          name: "Bandcamp Friday shortlist",
          savedAt: "2026-08-01T09:30:00.000Z",
          summary: { subtotal: 35.87, currency: "USD" },
          items: [
            { id: "saved-1", title: "Cloud Studies", artist: "North Harbour", kind: "Digital album", price: 9, currency: "USD", art: "/assets/art-clouds.png", url: "https://fixture.bandcamp.com/album/cloud-studies" },
            { id: "saved-2", title: "Meridian Lines", artist: "Signal Field", kind: "Vinyl · Blue", price: 12, currency: "GBP", art: "/assets/art-meridian.png", url: "https://fixture.bandcamp.com/album/meridian-lines" },
            { id: "saved-3", title: "Velocity", artist: "Gaiko", kind: "Digital track", price: 8, currency: "GBP", art: "/assets/art-velocity.png", url: "https://fixture.bandcamp.com/track/velocity" }
          ]
        }],
        activity: []
      }
    } : {};
    if (location.search.includes("page-dj-persist")) {
      window.fixtureStored = { bandcampHubState: { dj: { pageOpen: true } } };
    }
    if (location.search.includes("single-track-cart")) {
      window.fixtureStored = { bandcampHubState: { open: true, activeTab: "cart", cartView: "current", cart: [], savedCarts: [] } };
    }
    if (location.search.includes("appearance-reskin")) {
      window.fixtureStored = { bandcampHubState: {
        open: true,
        activeTab: "settings",
        appearance: {
          pageAware: false,
          applyToPage: true,
          preset: "custom",
          customAccent: "#202020",
          customSurface: "#151515",
          customCard: "#191919",
          customPageBackground: "#f7f7f7",
          customPageSurface: "#111111",
          customNavbar: "#272044",
          customText: "#222222",
          customSecondaryText: "#b0b0b0",
          savedThemes: []
        }
      } };
    }
    if (location.search.includes("panel-header-unify")) {
      window.fixtureStored = { bandcampHubState: { open: true, activeTab: "settings" } };
    }
    if (location.search.includes("feed-home-setting")) {
      window.fixtureStored = { bandcampHubState: { open: true, activeTab: "settings" } };
    }
    if (location.search.includes("queue-footer-navigation") || location.search.includes("queue-row-controls") || location.search.includes("queue-single-card-controls")) {
      window.fixtureQueueNavigationTracks = [
        { id: "queue-one", playlistItemId: "playlist-one", title: "Queue One", artist: "Fixture", pageUrl: "https://fixture.bandcamp.com/track/queue-one", duration: 120, url: "https://t4.bcbits.com/stream/queue-one" },
        { id: "queue-two", playlistItemId: "playlist-two", title: "Queue Two", artist: "Fixture", pageUrl: "https://fixture.bandcamp.com/track/queue-two", duration: 130, url: "https://t4.bcbits.com/stream/queue-two" }
      ];
      if (location.search.includes("queue-single-card-controls")) window.fixtureQueueNavigationTracks.length = 1;
      window.fixtureQueueNavigationIndex = 0;
      window.fixtureQueuePlaying = true;
      window.fixtureStored = { bandcampHubState: { open: true, activeTab: "nowPlaying", playlist: window.fixtureQueueNavigationTracks } };
    }
    if (location.search.includes("queue-skip-unavailable")) {
      window.fixtureQueueSkipTracks = [
        { id: "skip-one", playlistItemId: "skip-one", title: "Skip One", artist: "Fixture", pageUrl: "https://fixture.bandcamp.com/track/skip-one", duration: 120, url: "https://t4.bcbits.com/stream/skip-one" },
        { id: "skip-missing", playlistItemId: "skip-missing", title: "Skip Missing", artist: "Fixture", pageUrl: "https://fixture.bandcamp.com/track/skip-missing", duration: 130, url: "", restoreError: "Unavailable" },
        { id: "skip-three", playlistItemId: "skip-three", title: "Skip Three", artist: "Fixture", pageUrl: "https://fixture.bandcamp.com/track/skip-three", duration: 140, url: "https://t4.bcbits.com/stream/skip-three" }
      ];
      window.fixtureStored = { bandcampHubState: { open: true, activeTab: "nowPlaying", playlist: window.fixtureQueueSkipTracks } };
    }
    if (location.search.includes("last-item-clear")) {
      window.fixtureLastItem = { id: "last-item", playlistItemId: "playlist-last", title: "Last Queue Item", artist: "Fixture", pageUrl: "https://fixture.bandcamp.com/track/last-item", duration: 120, url: "https://t4.bcbits.com/stream/last-item" };
      window.fixtureStored = { bandcampHubState: { open: true, activeTab: "nowPlaying", playlist: [window.fixtureLastItem] } };
    }
    if (location.search.includes("cross-tab-queue-sync")) {
      window.fixtureStored = { bandcampHubState: { open: true, activeTab: "nowPlaying", playlist: [
        { id: "cross-tab-one", playlistItemId: "cross-tab-one", title: "Cross-tab One", artist: "Fixture", pageUrl: "https://fixture.bandcamp.com/track/cross-tab-one", duration: 120, url: "https://t4.bcbits.com/stream/cross-tab-one" }
      ] } };
    }
    if (location.search.includes("collection-now-playing-append") || location.search.includes("collection-rapid-switch")) {
      window.fixtureStored = { bandcampHubState: { open: true, activeTab: "nowPlaying", playlist: [] } };
      document.body.insertAdjacentHTML("beforeend", `
        <div id="collection-items"><div class="collection-grid" data-ismain="true" data-iswish="false">
          <div class="collection-item-container" data-trackid="collection-album" data-title="Head Above The Clouds" data-tralbumtype="a">
            <button class="track_play_auxiliary" type="button">Play Honey Be</button>
            <div class="collection-item-gallery-container" data-trackid="honey-be" data-item-json='{"featured_track_id":"honey-be","featured_track_title":"Honey Be","featured_track_duration":203,"item_title":"Head Above The Clouds","item_url":"https://fixture.bandcamp.com/album/head-above-the-clouds","band_name":"Micah Jey"}'><a class="item-link" href="https://fixture.bandcamp.com/album/head-above-the-clouds"></a><img class="collection-item-art" src="/assets/art-clouds.png"><div class="collection-title-details"><span class="collection-item-title">Head Above The Clouds</span><span class="collection-item-artist">Micah Jey</span></div></div>
            <div class="bottom-owner-controls"><div class="redownload-item"><a href="https://fixture.bandcamp.com/download/honey-be">Download</a></div></div>
          </div>
          <div class="collection-item-container" data-trackid="second-track" data-title="Second Track" data-tralbumtype="t">
            <button class="track_play_auxiliary" type="button">Play Second Track</button>
            <div class="collection-item-gallery-container"><a class="item-link" href="https://fixture.bandcamp.com/track/second-track"></a><img class="collection-item-art" src="/assets/art-meridian.png"><div class="collection-title-details"><span class="collection-item-title">Second Track</span><span class="collection-item-artist">Fixture Artist</span></div></div>
            <div class="bottom-owner-controls"><div class="redownload-item"><a href="https://fixture.bandcamp.com/download/second-track">Download</a></div></div>
          </div>
        </div></div>`);
    }
    if (location.search.includes("page-playlist-placement") || location.search.includes("page-playing-sync") || location.search.includes("page-unrelated-playing-sync") || location.search.includes("page-stale-playback") || location.search.includes("page-unknown-track") || location.search.includes("album-switch-performance")) {
      document.querySelector(".fixture-track-list").hidden = false;
      const tralbumScript = document.querySelector("script[data-tralbum]");
      const tralbum = JSON.parse(tralbumScript.getAttribute("data-tralbum"));
      tralbum.trackinfo[0].file = { "mp3-128": "https://t4.bcbits.com/stream/fixture-track" };
      tralbum.trackinfo[1].file = { "mp3-128": "https://t4.bcbits.com/stream/next-fixture-track" };
      tralbumScript.setAttribute("data-tralbum", JSON.stringify(tralbum));
    }
    if (location.search.includes("album-switch-performance")) {
      window.fixtureAlbumPerformanceQueue = [
        { id: "1", playlistItemId: "album-track-one", title: "Fixture Track", artist: "Fixture Artist", pageUrl: "https://fixture-artist.bandcamp.com/track/fixture-track", duration: 180, url: "https://t4.bcbits.com/stream/fixture-track" },
        { id: "2", playlistItemId: "album-track-two", title: "Next Fixture Track", artist: "Fixture Artist", pageUrl: "https://fixture-artist.bandcamp.com/track/next-fixture-track", duration: 200, url: "https://t4.bcbits.com/stream/next-fixture-track" }
      ];
      window.fixtureStored = { bandcampHubState: { open: true, activeTab: "nowPlaying", playlist: window.fixtureAlbumPerformanceQueue } };
      window.fixtureAlbumSwitchStartedAt = 0;
      window.fixtureAlbumSwitchFinishedAt = 0;
      const nativeMedia = [document.querySelector(".inline_player audio"), document.createElement("audio")];
      document.querySelector(".inline_player").append(nativeMedia[1]);
      window.fixtureNativeMediaPaused = [true, true];
      window.fixtureNativeMediaPauseCounts = [0, 0];
      nativeMedia.forEach((media, index) => {
        Object.defineProperty(media, "paused", { configurable: true, get: () => window.fixtureNativeMediaPaused[index] });
        media.pause = () => {
          window.fixtureNativeMediaPaused[index] = true;
          window.fixtureNativeMediaPauseCounts[index] += 1;
          media.dispatchEvent(new Event("pause"));
        };
      });
    }
    URL.createObjectURL = (blob) => {
      window.fixtureDownloads.push({ blob, filename: "" });
      return `blob:fixture-${window.fixtureDownloads.length}`;
    };
    URL.revokeObjectURL = () => {};
    const fixtureAnchorClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function () {
      if (this.download) {
        window.fixtureDownloads.at(-1).filename = this.download;
        return;
      }
      fixtureAnchorClick.call(this);
    };
    window.addEventListener("error", (event) => {
      document.documentElement.dataset.fixtureError = `${event.message} @ ${event.lineno}:${event.colno}`;
    });
    window.addEventListener("unhandledrejection", (event) => {
      document.documentElement.dataset.fixtureError = String(event.reason);
    });
    window.fixtureRuntimeMessages = [];
    const fixtureChrome = {
      runtime: {
        lastError: null,
        getURL: (path) => {
          document.documentElement.dataset.lastExtensionAsset = path;
          return new URL(`/${path}`, location.href).href;
        },
        getManifest: () => ({ version: "0.5.17" }),
        sendMessage(message, callback) {
          window.fixtureRuntimeMessages.push(structuredClone(message));
          if (location.search.includes("album-switch-performance")) {
            if (message.type === "BANDCAMP_HUB_GET_SEAMLESS_STATE") {
              callback?.({ ok: true, state: { enabled: true, status: "playing", isPlaying: true, currentTime: 16, duration: 180, index: 0, track: window.fixtureAlbumPerformanceQueue[0], queue: window.fixtureAlbumPerformanceQueue } });
              return;
            }
            if (message.type === "BANDCAMP_HUB_RESOLVE_PLAYLIST_ITEMS") {
              window.setTimeout(() => callback?.({ ok: true, items: message.items }), 3500);
              return;
            }
            if (message.type === "BANDCAMP_HUB_SEAMLESS_PLAY_INDEX") {
              const index = Math.max(0, Math.min(window.fixtureAlbumPerformanceQueue.length - 1, Number(message.index) || 0));
              window.fixtureAlbumSwitchFinishedAt = performance.now();
              callback?.({ ok: true, state: { enabled: true, status: "playing", isPlaying: true, currentTime: 0, duration: window.fixtureAlbumPerformanceQueue[index].duration, index, track: window.fixtureAlbumPerformanceQueue[index], queue: window.fixtureAlbumPerformanceQueue } });
              return;
            }
          }
          if (location.search.includes("queue-skip-unavailable")) {
            const playable = window.fixtureQueueSkipTracks.filter((track) => track.url);
            if (message.type === "BANDCAMP_HUB_GET_SEAMLESS_STATE") {
              callback?.({ ok: true, state: { enabled: true, status: "playing", isPlaying: true, currentTime: 8, duration: 120, index: 0, track: playable[0], queue: playable } });
              return;
            }
            if (message.type === "BANDCAMP_HUB_RESOLVE_PLAYLIST_ITEMS") {
              callback?.({ ok: true, items: message.items.map((item) => item.playlistItemId === "skip-missing" ? { ...item, url: "", restoreError: "Unavailable" } : item) });
              return;
            }
            if (message.type === "BANDCAMP_HUB_SEAMLESS_ENABLE") {
              const index = Math.max(0, Math.min(message.queue.length - 1, Number(message.index) || 0));
              callback?.({ ok: true, state: { enabled: true, status: "playing", isPlaying: true, currentTime: 0, duration: message.queue[index].duration, index, track: message.queue[index], queue: message.queue } });
              return;
            }
            if (message.type === "BANDCAMP_HUB_SEAMLESS_PLAY_INDEX") {
              const index = Math.max(0, Math.min(playable.length - 1, Number(message.index) || 0));
              callback?.({ ok: true, state: { enabled: true, status: "playing", isPlaying: true, currentTime: 0, duration: playable[index].duration, index, track: playable[index], queue: playable } });
              return;
            }
          }
          if ((location.search.includes("queue-footer-navigation") || location.search.includes("queue-row-controls") || location.search.includes("queue-single-card-controls")) && ["BANDCAMP_HUB_GET_SEAMLESS_STATE", "BANDCAMP_HUB_SEAMLESS_PLAY_INDEX", "BANDCAMP_HUB_SEAMLESS_PLAY_PAUSE", "BANDCAMP_HUB_SEAMLESS_SEEK"].includes(message.type)) {
            if (message.type === "BANDCAMP_HUB_SEAMLESS_PLAY_INDEX") {
              window.fixtureQueueNavigationIndex = Math.max(0, Math.min(window.fixtureQueueNavigationTracks.length - 1, Number(message.index) || 0));
              window.fixtureQueuePlaying = true;
            }
            if (message.type === "BANDCAMP_HUB_SEAMLESS_PLAY_PAUSE") window.fixtureQueuePlaying = !window.fixtureQueuePlaying;
            const index = window.fixtureQueueNavigationIndex;
            const playbackTrack = (location.search.includes("queue-row-controls-stale-identity") || location.search.includes("queue-single-card-controls"))
              ? { ...window.fixtureQueueNavigationTracks[index], playlistItemId: "" }
              : window.fixtureQueueNavigationTracks[index];
            const playbackQueue = (location.search.includes("queue-row-controls-stale-identity") || location.search.includes("queue-single-card-controls"))
              ? window.fixtureQueueNavigationTracks.map((track) => ({ ...track, playlistItemId: "" }))
              : window.fixtureQueueNavigationTracks;
            const respond = () => callback?.({ ok: true, state: { enabled: true, status: window.fixtureQueuePlaying ? "playing" : "paused", isPlaying: window.fixtureQueuePlaying, currentTime: 0, duration: window.fixtureQueueNavigationTracks[index].duration, index, track: playbackTrack, queue: playbackQueue } });
            if (location.search.includes("queue-row-controls") && message.type === "BANDCAMP_HUB_SEAMLESS_PLAY_INDEX") window.setTimeout(respond, 120);
            else respond();
            return;
          }
          if (location.search.includes("last-item-clear") && ["BANDCAMP_HUB_GET_SEAMLESS_STATE", "BANDCAMP_HUB_CLEAR_PLAYBACK"].includes(message.type)) {
            const disabled = message.type === "BANDCAMP_HUB_CLEAR_PLAYBACK";
            callback?.({ ok: true, state: disabled
              ? { enabled: false, status: "idle", isPlaying: false, currentTime: 0, duration: 0, index: -1, track: null, queue: [] }
              : { enabled: true, status: "playing", isPlaying: true, currentTime: 14, duration: 120, index: 0, track: window.fixtureLastItem, queue: [window.fixtureLastItem] }
            });
            return;
          }
          if (message.type === "BANDCAMP_HUB_GET_SEAMLESS_STATE" && location.search.includes("navigation-reconnect")) {
            const track = {
              id: "remote-track", title: "Previous Page Track", artist: "Previous Artist",
              pageUrl: "https://previous-artist.bandcamp.com/track/previous-page-track",
              duration: 240, url: "https://t4.bcbits.com/stream/previous-page-track"
            };
            callback?.({ ok: true, state: { enabled: true, status: "playing", isPlaying: true, currentTime: 64, duration: 240, index: 0, track, queue: [track] } });
            return;
          }
          if (message.type === "BANDCAMP_HUB_RESOLVE_PLAYLIST_ITEMS" && location.search.includes("collection-now-playing-append")) {
            callback?.({ ok: true, items: (message.items || []).map((item) => ({
              ...item,
              duration: item.title === "Honey Be" ? 180 : 200,
              url: item.title === "Honey Be" ? "https://t4.bcbits.com/stream/honey-be" : "https://t4.bcbits.com/stream/second-track"
            })) });
            return;
          }
          if (message.type === "BANDCAMP_HUB_RESOLVE_PLAYLIST_ITEMS" && location.search.includes("collection-rapid-switch")) {
            const items = (message.items || []).map((item) => ({
              ...item,
              duration: item.title === "Honey Be" ? 180 : 200,
              url: item.title === "Honey Be" ? "https://t4.bcbits.com/stream/honey-be" : "https://t4.bcbits.com/stream/second-track"
            }));
            window.setTimeout(() => callback?.({ ok: true, items }), items[0]?.title === "Honey Be" ? 220 : 20);
            return;
          }
          if (message.type === "BANDCAMP_HUB_SEAMLESS_UPDATE_QUEUE" && location.search.includes("collection-now-playing-append")) {
            window.fixtureCollectionSeamlessState = {
              ...window.fixtureCollectionSeamlessState,
              enabled: true,
              status: "playing",
              isPlaying: true,
              index: 0,
              track: message.queue[0],
              queue: message.queue
            };
            callback?.({ ok: true, state: window.fixtureCollectionSeamlessState });
            return;
          }
          if (message.type === "BANDCAMP_HUB_SEAMLESS_ENABLE") {
            const index = Math.max(0, Math.min(message.queue.length - 1, Number(message.index) || 0));
            const enabledState = { enabled: true, status: "playing", isPlaying: true, index, track: message.queue[index], queue: message.queue };
            if (location.search.includes("collection-now-playing-append")) window.fixtureCollectionSeamlessState = enabledState;
            callback?.({ ok: true, state: enabledState });
            return;
          }
          if (message.type === "BANDCAMP_HUB_RESOLVE_CART_METADATA") {
            callback?.({ ok: true, items: (message.items || []).map((item) => ({ ...item, artist: "Resolved Cart Artist" })) });
            return;
          }
          callback?.({ ok: true, state: { enabled: false, status: "idle" } });
        },
        onMessage: { addListener(listener) { window.fixtureRuntimeListener = listener; } }
      },
      storage: {
        local: {
          get(_key, callback) { document.documentElement.dataset.storageRead = "true"; callback(window.fixtureStored); },

          && !cards[1]?.classList.contains("is-playing")
          && queueUpdate?.queue?.map((item) => item.title).join(",") === "Honey Be"
          && root?.querySelector(".hub-now-playing-count")?.textContent === "2"
          && root?.querySelector(".hub-player-title")?.textContent === "Honey Be"
          && !window.fixtureRuntimeMessages.some((message) => message.type === "BANDCAMP_HUB_SEAMLESS_PLAY_PAUSE");
        document.title = initiallyPlaying && appendedWithoutReplacing
          ? "PASS: collection play persists and add appends fixture"
          : `FAIL: collection queue init:${initiallyPlaying}/append:${appendedWithoutReplacing}/update:${queueUpdate?.queue?.map((item) => item.title).join(",") || "none"}/${window.fixtureStored.bandcampHubState?.playlist?.map((item) => item.title).join(",") || "empty"}/${cards.map((card) => card.className).join("|")}`;
        return;
      }
      if (location.search.includes("collection-rapid-switch")) {
        const firstControl = document.querySelector('.collection-item-container[data-trackid="collection-album"] .track_play_auxiliary');
        const secondControl = document.querySelector('.collection-item-container[data-trackid="second-track"] .track_play_auxiliary');
        firstControl?.click();
        await new Promise((resolve) => setTimeout(resolve, 20));
        secondControl?.click();
        await new Promise((resolve) => setTimeout(resolve, 320));
        const enableMessages = window.fixtureRuntimeMessages.filter((message) => message.type === "BANDCAMP_HUB_SEAMLESS_ENABLE");
        const activeTrack = enableMessages.at(-1)?.queue?.[enableMessages.at(-1)?.index];
        const queueTitles = window.fixtureStored.bandcampHubState?.playlist?.map((item) => item.title).join(",") || "";
        document.title = enableMessages.length === 1
          && activeTrack?.title === "Second Track"
          && queueTitles === "Second Track"
          && window.fixtureStored.bandcampHubState?.playlistMode === "browse"
          ? "PASS: rapid collection switch keeps latest request fixture"
          : `FAIL: rapid collection switch ${enableMessages.length}/${activeTrack?.title || "none"}/${queueTitles || "empty"}`;
        return;
      }
      if (location.search.includes("last-item-clear")) {
        const remove = root?.querySelector(".hub-playlist-track .hub-playlist-icon-button:not(.is-play-action)");
        remove?.click();
        await new Promise((resolve) => setTimeout(resolve, 30));
        window.fixtureRuntimeListener?.({ type: "BANDCAMP_HUB_SEAMLESS_STATE", state: { enabled: true, status: "playing", isPlaying: true, currentTime: 18, duration: 120, index: 0, track: window.fixtureLastItem, queue: [window.fixtureLastItem] } }, {}, () => {});
        await new Promise((resolve) => setTimeout(resolve, 20));
        const cleared = (window.fixtureStored.bandcampHubState?.playlist || []).length === 0
          && window.fixtureRuntimeMessages.some((message) => message.type === "BANDCAMP_HUB_CLEAR_PLAYBACK")
          && root?.querySelector(".hub-player-track")?.classList.contains("is-empty")
          && !root?.querySelector(".hub-player-title")?.textContent
          && root?.querySelector(".hub-now-playing-count")?.textContent === "0"
          && root?.querySelector(".hub-play-button")?.disabled;
        if (location.search.includes("last-item-clear-replay")) {
          const replay = document.createElement("button");
          replay.className = "track_play_auxiliary";
          document.body.append(replay);
          replay.click();
          window.fixtureRuntimeListener?.({ type: "BANDCAMP_HUB_SEAMLESS_STATE", state: { enabled: true, status: "playing", isPlaying: true, currentTime: 0, duration: 120, index: 0, track: window.fixtureLastItem, queue: [window.fixtureLastItem] } }, {}, () => {});
          await new Promise((resolve) => setTimeout(resolve, 20));
          const restored = root?.querySelector(".hub-player-title")?.textContent === "Last Queue Item"
            && !root?.querySelector(".hub-player-track")?.classList.contains("is-empty")
            && !root?.querySelector(".hub-play-button")?.disabled;
          document.title = cleared && restored
            ? "PASS: cleared track can be replayed fixture"
            : `FAIL: cleared track replay ${root?.querySelector(".hub-player-title")?.textContent || "missing"}`;
          return;
        }
        document.title = cleared
          ? "PASS: last Now Playing item clears player fixture"
          : `FAIL: last item clear ${root?.querySelector(".hub-player-title")?.textContent || "stale player"}`;
        return;
      }
      if (location.search.includes("page-dj-persist")) {
        const pageDjButton = document.querySelector(".bandcamp-hub-page-dj");
        const pageDjHost = document.querySelector(".inline_player > .bandcamp-hub-page-dj-host");
        document.title = pageDjButton?.classList.contains("is-active")
          && pageDjButton?.getAttribute("aria-expanded") === "true"
          && pageDjButton?.getAttribute("aria-label") === "Hide DJ tools on this page"
          && !pageDjHost?.hidden
          && Boolean(pageDjHost?.shadowRoot?.querySelector(".hub-dj-card"))
          ? "PASS: persisted page DJ fixture"
          : "FAIL: persisted page DJ fixture";
        return;
      }
      const pageDjButton = document.querySelector(".bandcamp-hub-page-dj");
      pageDjButton?.click();
      const pageDjRoot = document.querySelector(".inline_player > .bandcamp-hub-page-dj-host")?.shadowRoot;
      const pageDjHost = document.querySelector(".inline_player > .bandcamp-hub-page-dj-host");
      const pageOpenedDj = Boolean(
        pageDjRoot?.querySelector(".hub-dj-card")
        && !root?.querySelector(".hub-dj-card")
        && root?.querySelector(".hub-dj-player-button")?.getAttribute("aria-expanded") === "false"
        && pageDjButton?.getAttribute("aria-expanded") === "true"
        && pageDjButton?.classList.contains("is-active")
        && !pageDjButton?.textContent.trim()
        && getComputedStyle(pageDjButton).width === "32px"
        && getComputedStyle(pageDjButton).borderRadius === "4px"
        && getComputedStyle(pageDjHost).maxWidth === "none"
        && pageDjHost?.getBoundingClientRect().width > 420
      );
      root?.querySelector(".hub-dj-player-button")?.click();
      const mirroredControlSet = Boolean(root?.querySelector(".hub-dj-card"))
        && root?.querySelectorAll(".hub-dj-card button, .hub-dj-card input").length
          === pageDjRoot?.querySelectorAll(".hub-dj-card button, .hub-dj-card input").length;
      root?.querySelector(".hub-dj-player-button")?.click();
      const inlineRemainsOpen = !root?.querySelector(".hub-dj-card")
        && Boolean(pageDjRoot?.querySelector(".hub-dj-card"))
        && pageDjButton?.getAttribute("aria-expanded") === "true";
      root?.querySelector(".hub-dj-player-button")?.click();
      const knobDial = root?.querySelector(".hub-dj-knob-dial");
      const knobInput = knobDial?.querySelector(".hub-dj-knob-input");
      if (knobDial && knobInput) {
        knobDial.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, button: 0, pointerId: 17, clientX: 100, clientY: 100 }));
        window.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, pointerId: 17, clientX: 100, clientY: 40 }));
        window.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, pointerId: 17, clientX: 100, clientY: 40 }));
      }
      const slider = root?.querySelector(".hub-dj-fader:not(.is-gain) .hub-dj-fader-input");
      if (slider) {
        slider.value = "5.5";
        slider.dispatchEvent(new Event("input", { bubbles: true }));
        slider.dispatchEvent(new Event("change", { bubbles: true }));
      }
      const gainRail = root?.querySelector(".hub-dj-fader.is-gain .hub-dj-fader-rail");
      const gainSlider = gainRail?.querySelector(".hub-dj-fader-input");
      if (gainRail && gainSlider) {
        gainSlider.value = "-6";
        gainSlider.dispatchEvent(new Event("input", { bubbles: true }));
        gainRail.dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
      }
      window.fixtureRuntimeListener?.({
        type: "BANDCAMP_HUB_SEAMLESS_STATE",
        state: {
          enabled: true,
          status: "playing",
          isPlaying: true,
          currentTime: 10,
          duration: 180,
          progress: 10 / 180,
          index: 0,
          detectedBpm: 120,
          automaticBpm: 120,
          detectedKey: { camelot: "11A", shortName: "F# min", name: "F-sharp minor" },
          track: { title: "Fixture Track", artist: "Fixture Artist", pageUrl: "https://fixture-artist.bandcamp.com/track/fixture-track" },
          queue: []
        }
      }, {}, () => {});
      const nativeAction = document.querySelector(".fixture-native-play");
      const nativeButton = document.querySelector(".playbutton");
      const nativeStatus = document.querySelector(".play_status");
      const platterAdjustments = root?.querySelectorAll(".hub-dj-platter-adjustments .hub-dj-knob");
      const bpmReset = root?.querySelector(".hub-dj-bpm-reset");
      const loopButtons = root?.querySelectorAll(".hub-dj-loop-button");
      const loopArrows = root?.querySelectorAll(".hub-dj-loop-arrow");
      const launcher = root?.querySelector(".hub-launcher");
      const headerLauncherInjected = document.querySelector(".menu-items > .feed + #bandcamp-hub-extension-root")
        && launcher?.classList.contains("is-header")
        && launcher?.classList.contains("is-modern-header")
        && !launcher?.classList.contains("is-floating")
        && getComputedStyle(launcher).position === "relative"
        && getComputedStyle(launcher).visibility === "visible";
      root?.querySelector('.hub-tab[data-tab="settings"]')?.click();
      const layoutMode = root?.querySelector(".hub-layout-mode-select");
      const dockSide = root?.querySelector(".hub-dock-side-select");
      const panel = root?.querySelector(".hub-panel");
      const layoutToggle = root?.querySelector(".hub-layout-toggle");
      const headerReset = root?.querySelector(".hub-reset");
      const floatingBeforeDock = panel?.getBoundingClientRect();
      if (layoutMode) {
        layoutMode.value = "docked";
        layoutMode.dispatchEvent(new Event("change", { bubbles: true }));
      }
      const dockedRect = panel?.getBoundingClientRect();
      const rightDockedApplied = dockSide?.value === "right"
        && panel?.classList.contains("is-dock-right")
        && Math.abs(window.innerWidth - (dockedRect?.right || 0)) < 1
        && launcher?.classList.contains("is-panel-open")
        && !headerReset?.textContent.trim()
        && headerReset?.querySelector(".hub-reset-symbol")?.style.getPropertyValue("--hub-reset-icon").includes("icon-chevron.svg")
        && headerReset?.querySelector(".hub-reset-symbol")?.style.getPropertyValue("--hub-reset-rotation") === "-90deg"
        && headerReset?.getAttribute("aria-label") === "Close BandKit to the right";
      const dockRightResizeHandle = panel?.querySelector(".hub-resize-handle.is-left");
      const dockRightBlockedHandle = panel?.querySelector(".hub-resize-handle.is-right");
      const rightWidthBefore = panel?.getBoundingClientRect().width || 0;
      if (dockRightResizeHandle) {
        const edgeX = panel.getBoundingClientRect().left;
        dockRightResizeHandle.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, button: 0, pointerId: 31, clientX: edgeX, clientY: 300 }));
        dockRightResizeHandle.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, pointerId: 31, clientX: edgeX - 48, clientY: 300 }));
        dockRightResizeHandle.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, pointerId: 31, clientX: edgeX - 48, clientY: 300 }));
      }
      const rightWidthAfter = panel?.getBoundingClientRect().width || 0;
      const rightEdgeResizeWorks = rightWidthAfter > rightWidthBefore + 40
        && getComputedStyle(dockRightResizeHandle).display !== "none"
        && getComputedStyle(dockRightBlockedHandle).display === "none";
      if (dockSide) {
        dockSide.value = "left";
        dockSide.dispatchEvent(new Event("change", { bubbles: true }));
      }
      const leftDockedRect = panel?.getBoundingClientRect();
      const leftDockedApplied = panel?.classList.contains("is-dock-left")
        && Math.abs(leftDockedRect?.left || 0) < 1
        && launcher?.classList.contains("is-panel-open")
        && !headerReset?.textContent.trim()
        && headerReset?.querySelector(".hub-reset-symbol")?.style.getPropertyValue("--hub-reset-rotation") === "90deg"
        && headerReset?.getAttribute("aria-label") === "Close BandKit to the left";
      const dockLeftResizeHandle = panel?.querySelector(".hub-resize-handle.is-right");
      const dockLeftBlockedHandle = panel?.querySelector(".hub-resize-handle.is-left");
      const leftWidthBefore = panel?.getBoundingClientRect().width || 0;
      if (dockLeftResizeHandle) {
        const edgeX = panel.getBoundingClientRect().right;
        dockLeftResizeHandle.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, button: 0, pointerId: 32, clientX: edgeX, clientY: 300 }));
        dockLeftResizeHandle.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, pointerId: 32, clientX: edgeX + 36, clientY: 300 }));
        dockLeftResizeHandle.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, pointerId: 32, clientX: edgeX + 36, clientY: 300 }));
      }
      const leftWidthAfter = panel?.getBoundingClientRect().width || 0;
      const leftEdgeResizeWorks = leftWidthAfter > leftWidthBefore + 28
        && getComputedStyle(dockLeftResizeHandle).display !== "none"
        && getComputedStyle(dockLeftBlockedHandle).display === "none";
      headerReset?.click();
      const dockedClosed = panel?.classList.contains("is-hidden")
        && !launcher?.classList.contains("is-panel-open");
      launcher?.click();
      const dockedReopened = !panel?.classList.contains("is-hidden")
        && launcher?.classList.contains("is-panel-open");
      if (layoutMode) {
        layoutMode.value = "floating";
        layoutMode.dispatchEvent(new Event("change", { bubbles: true }));
      }
      const floatingAfterDock = panel?.getBoundingClientRect();
      const floatingRestored = Boolean(
        floatingBeforeDock && floatingAfterDock
        && !panel?.classList.contains("is-docked")
        && Math.abs(floatingBeforeDock.left - floatingAfterDock.left) < 1
        && Math.abs(floatingBeforeDock.top - floatingAfterDock.top) < 1
        && Math.abs(floatingBeforeDock.width - floatingAfterDock.width) < 1
        && Math.abs(floatingBeforeDock.height - floatingAfterDock.height) < 1
      );
      const floatingHeaderControl = layoutToggle?.getAttribute("aria-label") === "Dock BandKit to the left"
        && !headerReset?.textContent.trim()
        && headerReset?.querySelector(".hub-reset-symbol")?.style.getPropertyValue("--hub-reset-icon").includes("icon-reset.svg")
        && headerReset?.querySelector(".hub-reset-symbol")?.style.getPropertyValue("--hub-reset-rotation") === "0deg";
      layoutToggle?.click();
      const headerDocked = panel?.classList.contains("is-docked")
        && layoutToggle?.getAttribute("aria-label") === "Return BandKit to floating mode"
        && layoutToggle?.classList.contains("is-docked")
        && Math.abs(panel?.getBoundingClientRect().left || 0) < 1;
      root?.querySelector('.hub-tab[data-tab="activity"]')?.click();
      const activityUpdated = root?.querySelector(".hub-activity-backup .hub-cart-backup-time");
      const activityDownloadButton = root?.querySelector(".hub-activity-download");
      const activityUpdateAligned = Boolean(activityUpdated && activityDownloadButton)
        && activityUpdated.textContent.startsWith("Last updated ")
        && activityUpdated.getBoundingClientRect().right < activityDownloadButton.getBoundingClientRect().left;
      root?.querySelector(".hub-activity-download")?.click();
      const activityDownload = window.fixtureDownloads.at(-1);
      const activityHtml = activityDownload ? await activityDownload.blob.text() : "";
      const audio = document.querySelector("audio");
      document.title = root?.querySelector(".hub-dj-card")
        && pageOpenedDj
        && mirroredControlSet
        && inlineRemainsOpen
        && audio.playbackRate === 1.055
        && Number(knobInput?.value) > 0
        && gainSlider?.value === "0"
        && nativeAction?.getAttribute("aria-label") === "Pause"
        && nativeButton?.classList.contains("playing")
        && nativeStatus?.classList.contains("playing")
        && !nativeStatus?.classList.contains("paused")
        && platterAdjustments?.length === 2
        && loopButtons?.length === 4
        && [...loopButtons].every((button) => !button.disabled)
        && [...loopButtons].map((button) => button.textContent).join(",") === "1,2,4,8"
        && loopArrows?.length === 2
        && !loopArrows[0]?.disabled
        && loopArrows[1]?.disabled
        && bpmReset && !bpmReset.disabled
        && rightDockedApplied
        && rightEdgeResizeWorks
        && leftDockedApplied
        && leftEdgeResizeWorks
        && dockedClosed
        && dockedReopened
        && floatingRestored
        && floatingHeaderControl
        && headerDocked
        && activityUpdateAligned
        && headerLauncherInjected
        && window.fixtureStored.bandcampHubState?.layoutMode === "docked"
        && window.fixtureStored.bandcampHubState?.dockSide === "left"
        && window.fixtureStored.bandcampHubLayout?.layoutMode === "docked"
        && window.fixtureStored.bandcampHubLayout?.dockSide === "left"
        && window.fixtureStored.bandcampHubLayout?.dockedWidth === Math.round(dockLeftResizeHandle?.closest(".hub-panel")?.getBoundingClientRect().width || 0)
        && Number(window.fixtureStored.bandcampHubLayout?.revision) > 0
        && window.fixtureStored.bandcampHubState?.dj?.pageOpen === true
        && activityDownload?.filename.startsWith("bandcamp-activity-")
        && activityHtml.includes("Bandcamp activity log")
        && activityHtml.includes("Fixture Track")
        && activityHtml.includes("Fixture Artist")
        && activityHtml.includes("<time datetime=")
        && activityHtml.includes("https://fixture-artist.bandcamp.com/track/fixture-track")
        ? "PASS: BandKit DJ fixture"
        : `FAIL: rate ${audio.playbackRate}, knob ${knobInput?.value}, gain ${gainSlider?.value}, page ${nativeAction?.getAttribute("aria-label")}/${nativeButton?.className}/${nativeStatus?.className}`;
    }, 1000);
    if (location.search.includes("settings")) {
      window.setTimeout(() => {
        const root = document.querySelector("#bandcamp-hub-extension-root")?.querySelector("[data-bandcamp-hub]")?.shadowRoot;
        root?.querySelector('.hub-tab[data-tab="settings"]')?.click();
      }, 1250);
    }
  </script>
</body>
</html>
