<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BandKit DJ fixture</title>
  <style>
    body { background: #171c22; color: #d9e5ee; font-family: Arial, sans-serif; margin: 0; min-height: 100vh; }
    .menu-items { align-items: center; display: flex; height: 53px; justify-content: flex-end; list-style: none; margin: 0; padding: 0 24px; }
    #pgBd { margin: 80px auto; max-width: 700px; }
    a, .primaryText { color: #f2a64a; }
    .secondaryText { color: #94a8b6; }
    .inline_player { padding: 24px; }
    .track_row_view { align-items: center; display: grid; grid-template-columns: 1fr auto; min-height: 44px; }
    .track-row-actions { display: flex; gap: 14px; }
    .track_row_view .buy-link { opacity: 0; }
    .track_row_view:hover .buy-link, .track_row_view:focus-within .buy-link { opacity: 1; }
  </style>
</head>
<body>
  <ul class="page-wrapper menu-items" role="menubar" aria-label="Main menu"><li class="feed" role="none"><a href="/feed" aria-label="Feed" role="menuitem">Feed</a></li><li><button id="fixture-header-cart" type="button" aria-label="Shopping cart">Cart</button></li></ul>
  <main id="pgBd">
    <h1 class="primaryText">DJ tools test page</h1>
    <p class="secondaryText">Dark artist theme fixture</p>
    <div class="inline_player">
      <span class="title">Fixture Track</span>
      <span class="time"><span class="time_elapsed">0:00</span> / <span class="time_total">3:00</span></span>
      <div class="progbar"><div class="progbar_fill" style="width:0%"></div><div class="thumb" style="left:0%"></div></div>
      <button class="fixture-native-play" type="button" aria-label="Play">
        <span class="playbutton paused"><span class="play_status paused"></span></span>
      </button>
      <audio></audio>
    </div>
    <button id="buyItem" type="button">Buy Digital Album</button>
    <div class="fixture-track-list" hidden>
      <div class="track_row_view" rel="tracknum=1"><span class="play_status"></span><a class="track-title" href="https://fixture-artist.bandcamp.com/track/fixture-track">Fixture Track</a><span class="track-row-actions"><a class="buy-link" href="#buy-one">buy track</a></span></div>
      <div class="track_row_view" rel="tracknum=2"><span class="play_status"></span><a class="track-title" href="https://fixture-artist.bandcamp.com/track/next-fixture-track">Next Fixture Track</a><span class="track-row-actions"><a class="buy-link" href="#buy-two">buy track</a></span></div>
    </div>
    <script data-tralbum='{"artist":"Fixture Artist","trackinfo":[{"track_id":1,"title":"Fixture Track"},{"track_id":2,"title":"Next Fixture Track"}]}' data-embed='{"artist":"Fixture Artist"}'></script>
  </main>
  <script>
    window.fixtureDownloads = [];
    window.fixturePurchaseClicks = 0;
    document.querySelector("#buyItem")?.addEventListener("click", () => { window.fixturePurchaseClicks += 1; });
    if (location.search.includes("header-shadow-cart")) {
      const menuBar = document.createElement("menu-bar");
      const menuShadow = menuBar.attachShadow({ mode: "open" });
      menuShadow.innerHTML = `<style>li.cart,li.cart[hidden],button[aria-label="Cart"],button[aria-label="Cart"][hidden]{display:flex!important}</style><ul><li class="cart"><button type="button" aria-label="Cart"><span>3</span></button></li></ul>`;
      document.body.prepend(menuBar);
      window.fixtureMenuShadow = menuShadow;
    }
    window.fixtureStored = (location.search.includes("cart-ui") || location.search.includes("cart-roundtrip")) ? {
      bandcampHubState: {
        open: true,
        activeTab: "cart",
        cartView: "saved",
        selectedSavedCartId: null,
        cartSummary: { subtotal: 35.87, currency: "USD" },
        cart: [
          { id: "live-1", title: "USD Fixture Album", artist: "Fixture Artist", kind: "Digital album", price: 9, currency: "USD", art: "art-clouds.png", url: "https://fixture.bandcamp.com/album/usd" },
          { id: "live-2", title: "GBP Fixture Album", artist: "Fixture Artist", kind: "Digital album", price: 12, currency: "GBP", art: "art-meridian.png", url: "https://fixture.bandcamp.com/album/gbp-one" },
          { id: "live-3", title: "Another GBP Album", artist: "Fixture Artist", kind: "Digital album", price: 8, currency: "GBP", art: "art-velocity.png", url: "https://fixture.bandcamp.com/album/gbp-two" }
        ],
        savedCarts: [{
          id: "saved-fixture",
          name: "Bandcamp Friday shortlist",
          savedAt: "2026-08-01T09:30:00.000Z",
          summary: { subtotal: 35.87, currency: "USD" },
          items: [
            { id: "saved-1", title: "Cloud Studies", artist: "North Harbour", kind: "Digital album", price: 9, currency: "USD", art: "art-clouds.png", url: "https://fixture.bandcamp.com/album/cloud-studies" },
            { id: "saved-2", title: "Meridian Lines", artist: "Signal Field", kind: "Vinyl · Blue", price: 12, currency: "GBP", art: "art-meridian.png", url: "https://fixture.bandcamp.com/album/meridian-lines" },
            { id: "saved-3", title: "Velocity", artist: "Gaiko", kind: "Digital track", price: 8, currency: "GBP", art: "art-velocity.png", url: "https://fixture.bandcamp.com/track/velocity" }
          ]
        }],
        activity: []
      }
    } : {};
    if (location.search.includes("page-dj-persist")) {
      window.fixtureStored = { bandcampHubState: { dj: { pageOpen: true } } };
    }
    if (location.search.includes("single-track-cart")) {
      window.fixtureStored = { bandcampHubState: { open: true, activeTab: "cart", cartView: "current", cart: [], savedCarts: [] } };
    }
    if (location.search.includes("appearance-reskin")) {
      window.fixtureStored = { bandcampHubState: {
        open: true,
        activeTab: "settings",
        appearance: {
          pageAware: false,
          applyToPage: true,
          preset: "custom",
          customAccent: "#202020",
          customSurface: "#151515",
          customPageBackground: "#f7f7f7",
          customPageSurface: "#111111",
          customText: "#222222",
          savedThemes: []
        }
      } };
    }
    if (location.search.includes("page-playlist-placement") || location.search.includes("page-playing-sync") || location.search.includes("page-unrelated-playing-sync") || location.search.includes("page-stale-playback")) {
      document.querySelector(".fixture-track-list").hidden = false;
      const tralbumScript = document.querySelector("script[data-tralbum]");
      const tralbum = JSON.parse(tralbumScript.getAttribute("data-tralbum"));
      tralbum.trackinfo[0].file = { "mp3-128": "https://t4.bcbits.com/stream/fixture-track" };
      tralbum.trackinfo[1].file = { "mp3-128": "https://t4.bcbits.com/stream/next-fixture-track" };
      tralbumScript.setAttribute("data-tralbum", JSON.stringify(tralbum));
    }
    URL.createObjectURL = (blob) => {
      window.fixtureDownloads.push({ blob, filename: "" });
      return `blob:fixture-${window.fixtureDownloads.length}`;
    };
    URL.revokeObjectURL = () => {};
    const fixtureAnchorClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function () {
      if (this.download) {
        window.fixtureDownloads.at(-1).filename = this.download;
        return;
      }
      fixtureAnchorClick.call(this);
    };
    window.addEventListener("error", (event) => {
      document.documentElement.dataset.fixtureError = `${event.message} @ ${event.lineno}:${event.colno}`;
    });
    window.addEventListener("unhandledrejection", (event) => {
      document.documentElement.dataset.fixtureError = String(event.reason);
    });
    window.fixtureRuntimeMessages = [];
    const fixtureChrome = {
      runtime: {
        lastError: null,
        getURL: (path) => {
          document.documentElement.dataset.lastExtensionAsset = path;
          return new URL(`/${path}`, location.href).href;
        },
        getManifest: () => ({ version: "0.5.17" }),
        sendMessage(message, callback) {
          window.fixtureRuntimeMessages.push(structuredClone(message));
          if (message.type === "BANDCAMP_HUB_GET_SEAMLESS_STATE" && location.search.includes("navigation-reconnect")) {
            const track = {
              id: "remote-track", title: "Previous Page Track", artist: "Previous Artist",
              pageUrl: "https://previous-artist.bandcamp.com/track/previous-page-track",
              duration: 240, url: "https://t4.bcbits.com/stream/previous-page-track"
            };
            callback?.({ ok: true, state: { enabled: true, status: "playing", isPlaying: true, currentTime: 64, duration: 240, index: 0, track, queue: [track] } });
            return;
          }
          if (message.type === "BANDCAMP_HUB_SEAMLESS_ENABLE") {
            const index = Math.max(0, Math.min(message.queue.length - 1, Number(message.index) || 0));
            callback?.({ ok: true, state: { enabled: true, status: "playing", isPlaying: true, index, track: message.queue[index], queue: message.queue } });
            return;
          }
          callback?.({ ok: true, state: { enabled: false, status: "idle" } });
        },
        onMessage: { addListener(listener) { window.fixtureRuntimeListener = listener; } }
      },
      storage: {
        local: {
          get(_key, callback) { document.documentElement.dataset.storageRead = "true"; callback(window.fixtureStored); },
          set(values) { Object.assign(window.fixtureStored, values); }
        }
      }
    };
  </script>
  <script>
    window.fixtureCartAutosaveReady = fetch(`/cart-autosave.js${location.search}`)
      .then((response) => response.text())
      .then((source) => eval(source));
  </script>
  <script>
    window.fixtureCartAutosaveReady.then(() => fetch(`/content.js${location.search}`))
      .then((response) => response.text())
      .then((source) => {
        eval(source.replaceAll("chrome.", "fixtureChrome."));
        document.documentElement.dataset.contentLoaded = "true";
      })
      .catch((error) => {
        document.documentElement.dataset.contentLoaded = "error";
        document.documentElement.dataset.fixtureError = String(error);
      });
  </script>
  <script>
    window.setTimeout(async () => {
      const root = document.querySelector("#bandcamp-hub-extension-root")?.querySelector("[data-bandcamp-hub]")?.shadowRoot;
      if (location.search.includes("header-shadow-cart")) {
        const nativeCart = window.fixtureMenuShadow?.querySelector('button[aria-label="Cart"]');
        const nativeCartWrapper = nativeCart?.closest("li");
        const hiddenByDefault = getComputedStyle(nativeCart).display === "none"
          && getComputedStyle(nativeCartWrapper).display === "none"
          && nativeCart.style.getPropertyValue("display") === "none"
          && nativeCart.style.getPropertyPriority("display") === "important"
          && window.fixtureMenuShadow.querySelector("#bandkit-native-header-cart-style");
        root?.querySelector('.hub-header-shortcut[data-tab="settings"]')?.click();
        root?.querySelector('[role="switch"][aria-label="Hide header shopping cart"]')?.click();
        const restored = getComputedStyle(nativeCart).display === "flex"
          && getComputedStyle(nativeCartWrapper).display === "flex"
          && !nativeCart.hasAttribute("hidden")
          && !nativeCartWrapper.hasAttribute("hidden")
          && nativeCart.style.getPropertyValue("display") === "";
        root?.querySelector('[role="switch"][aria-label="Hide header shopping cart"]')?.click();
        const hiddenAgain = getComputedStyle(nativeCart).display === "none"
          && getComputedStyle(nativeCartWrapper).display === "none";
        document.title = hiddenByDefault && restored && hiddenAgain
          ? "PASS: shadow header cart visibility fixture"
          : `FAIL: shadow cart ${getComputedStyle(nativeCart).display}/${getComputedStyle(nativeCartWrapper).display}`;
        return;
      }
      if (location.search.includes("cart-roundtrip")) {
        root?.querySelectorAll(".hub-cart-view-tab").forEach((button) => {
          if (button.textContent.includes("Cart")) button.click();
        });
        const downloadButton = [...(root?.querySelectorAll(".hub-cart-backup .hub-text-button") || [])].find((button) => button.textContent.includes("Download"));
        const importInput = root?.querySelector('.hub-cart-backup input[type="file"]');
        const importButton = [...(root?.querySelectorAll(".hub-cart-backup .hub-text-button") || [])].find((button) => button.textContent.includes("Import"));
        downloadButton?.click();
        const download = window.fixtureDownloads.at(-1);
        const exportedHtml = download ? await download.blob.text() : "";
        const embeddedText = new DOMParser().parseFromString(exportedHtml, "text/html").querySelector("#bandkit-cart-data")?.textContent || "";
        let payload = null;
        try { payload = JSON.parse(embeddedText); } catch {}
        if (importInput && download) {
          const file = new File([download.blob], download.filename, { type: "text/html" });
          Object.defineProperty(importInput, "files", { configurable: true, value: [file] });
          importInput.dispatchEvent(new Event("change", { bubbles: true }));
          await new Promise((resolve) => setTimeout(resolve, 80));
        }
        const importedSnapshot = window.fixtureStored.bandcampHubState?.savedCarts?.find((snapshot) => String(snapshot.id).startsWith("cart-import-"));
        document.title = download?.filename.endsWith(".html")
          && payload?.format === "bandkit-cart"
          && payload?.version === 1
          && payload?.items?.length === 3
          && importButton
          && importedSnapshot?.items?.length === 3
          ? "PASS: cart backup round trip"
          : `FAIL: cart backup round trip ${payload?.format || "no payload"}/${payload?.items?.length || 0}/${importedSnapshot?.items?.length || 0}`;
        return;
      }
      if (location.search.includes("navigation-reconnect")) {
        const currentItem = root?.querySelector(".hub-queue-item");
        const pause = currentItem?.querySelector('.hub-queue-action[aria-label^="Pause"]');
        pause?.click();
        document.title = currentItem?.textContent.includes("Previous Page Track")
          && root?.querySelector(".hub-player-title")?.textContent === "Previous Page Track"
          && root?.querySelector(".hub-play-button .hub-pause-glyph")
          && window.fixtureRuntimeMessages.some((message) => message.type === "BANDCAMP_HUB_SEAMLESS_PLAY_PAUSE")
          ? "PASS: navigation reconnects active playback"
          : "FAIL: navigation lost active playback";
        return;
      }
      if (location.search.includes("page-stale-playback")) {
        const staleTrack = {
          id: "stale", title: "Stale Track", artist: "Previous Artist",
          pageUrl: "https://previous-artist.bandcamp.com/track/stale-track",
          duration: 200, url: "https://t4.bcbits.com/stream/stale-track"
        };
        window.fixtureRuntimeListener?.({ type: "BANDCAMP_HUB_SEAMLESS_STATE", state: {
          enabled: true, status: "playing", isPlaying: true, currentTime: 20, duration: 200,
          index: 0, track: staleTrack, queue: [staleTrack]
        } }, {}, () => {});
        const titleBeforeClick = document.querySelector(".inline_player .title")?.textContent;
        document.querySelector(".fixture-native-play")?.click();
        await new Promise((resolve) => setTimeout(resolve, 80));
        const enableRequest = window.fixtureRuntimeMessages.findLast((message) => message.type === "BANDCAMP_HUB_SEAMLESS_ENABLE");
        document.title = titleBeforeClick === "Fixture Track"
          && enableRequest?.queue?.[enableRequest.index]?.title === "Fixture Track"
          ? "PASS: stale playback switches to clicked page track"
          : `FAIL: stale playback ${titleBeforeClick}/${enableRequest?.queue?.[enableRequest.index]?.title || "no handoff"}`;
        return;
      }
      if (location.search.includes("page-playing-sync")) {
        const queue = [
          { id: "1", title: "Fixture Track", artist: "Fixture Artist", pageUrl: "https://fixture-artist.bandcamp.com/track/fixture-track", duration: 180, url: "https://t4.bcbits.com/stream/fixture-track" },
          { id: "2", title: "Next Fixture Track (BandKit)", artist: "Fixture Artist", pageUrl: "https://fixture-artist.bandcamp.com/track/next-fixture-track", duration: 210, url: "https://t4.bcbits.com/stream/next-fixture-track" }
        ];
        window.fixtureRuntimeListener?.({ type: "BANDCAMP_HUB_SEAMLESS_STATE", state: {
          enabled: true, status: "playing", isPlaying: true, currentTime: 42, duration: 210, progress: 0.2,
          index: 1, track: queue[1], queue
        } }, {}, () => {});
        const inlinePlayer = document.querySelector(".inline_player");
        const inlineControl = inlinePlayer?.querySelector(".playbutton");
        const inlineAction = inlineControl?.closest("button, a, [role='button']");
        const rows = [...document.querySelectorAll(".track_row_view")];
        const firstControl = rows[0]?.querySelector(".play_status");
        const currentControl = rows[1]?.querySelector(".play_status");
        const synced = inlinePlayer?.querySelector(".title")?.textContent === "Next Fixture Track (BandKit)"
          && inlinePlayer?.classList.contains("bandcamp-hub-is-playing")
          && inlineControl?.classList.contains("playing")
          && inlineAction?.getAttribute("aria-label") === "Pause"
          && !firstControl?.classList.contains("playing")
          && currentControl?.classList.contains("playing")
          && currentControl?.getAttribute("aria-label") === "Pause"
          && rows[1]?.classList.contains("bandcamp-hub-current")
          && rows[1]?.classList.contains("bandcamp-hub-is-playing")
          && inlinePlayer?.querySelector(".time_elapsed")?.textContent === "0:42"
          && inlinePlayer?.querySelector(".time_total")?.textContent === "3:30"
          && inlinePlayer?.querySelector(".progbar_fill")?.style.width === "20%"
          && inlinePlayer?.querySelector(".thumb")?.style.left === "20%";
        window.fixtureRuntimeListener?.({ type: "BANDCAMP_HUB_SEAMLESS_STATE", state: {
          enabled: false, status: "idle", isPlaying: false
        } }, {}, () => {});
        const cleaned = !document.querySelector("[data-bandkit-playback-state]")
          && !inlineControl?.classList.contains("playing")
          && !currentControl?.classList.contains("playing")
          && currentControl?.getAttribute("aria-label") === null
          && inlinePlayer?.querySelector(".title")?.textContent === "Fixture Track"
          && inlinePlayer?.querySelector(".time_elapsed")?.textContent === "0:00"
          && inlinePlayer?.querySelector(".time_total")?.textContent === "3:00"
          && inlinePlayer?.querySelector(".progbar_fill")?.style.width === "0%"
          && inlinePlayer?.querySelector(".thumb")?.style.left === "0%";
        document.title = synced && cleaned
          ? "PASS: page playing state sync fixture"
          : `FAIL: page playing state sync ${inlinePlayer?.querySelector(".title")?.textContent}/${inlineControl?.className}/${currentControl?.className}`;
        return;
      }
      if (location.search.includes("page-unrelated-playing-sync")) {
        const pageQueue = [
          { id: "1", title: "Fixture Track", artist: "Fixture Artist", pageUrl: "https://fixture-artist.bandcamp.com/track/fixture-track", duration: 180, url: "https://t4.bcbits.com/stream/fixture-track" },
          { id: "2", title: "Next Fixture Track", artist: "Fixture Artist", pageUrl: "https://fixture-artist.bandcamp.com/track/next-fixture-track", duration: 210, url: "https://t4.bcbits.com/stream/next-fixture-track" }
        ];
        const remoteTrack = { id: "remote", title: "Hatching", artist: "MOULD", pageUrl: "https://moulditsmould.bandcamp.com/track/hatching", duration: 263, url: "https://t4.bcbits.com/stream/hatching" };
        const setPlayback = (track, queue, currentTime, duration) => window.fixtureRuntimeListener?.({ type: "BANDCAMP_HUB_SEAMLESS_STATE", state: {
          enabled: true, status: "playing", isPlaying: true, currentTime, duration, progress: currentTime / duration,
          index: Math.max(0, queue.indexOf(track)), track, queue
        } }, {}, () => {});
        const inlinePlayer = document.querySelector(".inline_player");
        const untouched = () => inlinePlayer?.querySelector(".title")?.textContent === "Fixture Track"
          && inlinePlayer?.querySelector(".time_elapsed")?.textContent === "0:00"
          && inlinePlayer?.querySelector(".time_total")?.textContent === "3:00"
          && inlinePlayer?.querySelector(".progbar_fill")?.style.width === "0%"
          && inlinePlayer?.querySelector(".thumb")?.style.left === "0%"
          && !inlinePlayer?.classList.contains("bandcamp-hub-current")
          && !inlinePlayer?.classList.contains("bandcamp-hub-is-playing")
          && !document.body.classList.contains("bandcamp-hub-remote-playing");
        setPlayback(remoteTrack, [remoteTrack], 88, 263);
        const unrelatedStayedNative = untouched();
        setPlayback(pageQueue[1], pageQueue, 42, 210);
        const matchingTrackSynced = inlinePlayer?.classList.contains("bandcamp-hub-is-playing")
          && inlinePlayer?.querySelector(".title")?.textContent === "Next Fixture Track";
        setPlayback(remoteTrack, [remoteTrack], 90, 263);
        const restoredAfterLeavingPage = untouched();
        document.title = unrelatedStayedNative && matchingTrackSynced && restoredAfterLeavingPage
          ? "PASS: unrelated playback leaves album player native"
          : `FAIL: unrelated playback ${inlinePlayer?.querySelector(".title")?.textContent}/${inlinePlayer?.querySelector(".time_elapsed")?.textContent}/${inlinePlayer?.className}`;
        return;
      }
      if (location.search.includes("appearance-reskin")) {
        const parseRgb = (value) => (value.match(/[\d.]+/g) || []).slice(0, 3).map(Number);
        const luminance = (value) => parseRgb(value).map((channel) => {
          const normalized = channel / 255;
          return normalized <= 0.03928 ? normalized / 12.92 : ((normalized + 0.055) / 1.055) ** 2.4;
        }).reduce((total, channel, index) => total + channel * [0.2126, 0.7152, 0.0722][index], 0);
        const ratio = (first, second) => (Math.max(luminance(first), luminance(second)) + 0.05) / (Math.min(luminance(first), luminance(second)) + 0.05);
        const bodyStyles = getComputedStyle(document.body);
        const pageStyles = getComputedStyle(document.querySelector("#pgBd"));
        const linkStyles = getComputedStyle(document.querySelector("a.track-title"));
        const pageThemeToggle = root?.querySelector(".hub-page-theme-toggle");
        const colourFields = root?.querySelectorAll('.hub-custom-theme-panel input[type="color"]');
        const accessibility = root?.querySelector(".hub-theme-accessibility");
        const themed = document.documentElement.dataset.bandkitPageTheme === "true"
          && bodyStyles.backgroundColor === "rgb(247, 247, 247)"
          && pageStyles.backgroundColor === "rgb(17, 17, 17)"
          && ratio(bodyStyles.color, bodyStyles.backgroundColor) >= 4.5
          && ratio(linkStyles.color, pageStyles.backgroundColor) >= 3
          && pageThemeToggle?.getAttribute("aria-checked") === "true"
          && colourFields?.length === 5
          && accessibility?.textContent.includes("Contrast adjusted automatically");
        pageThemeToggle?.click();
        const restored = document.documentElement.dataset.bandkitPageTheme === "false"
          && getComputedStyle(document.body).backgroundColor === "rgb(23, 28, 34)"
          && getComputedStyle(document.querySelector("a.track-title")).color === "rgb(242, 166, 74)";
        document.title = themed && restored
          ? "PASS: Bandcamp appearance reskin fixture"
          : `FAIL: Bandcamp appearance reskin ${bodyStyles.backgroundColor}/${pageStyles.backgroundColor}/${colourFields?.length}`;
        return;
      }
      if (location.search.includes("single-track-cart")) {
        document.dispatchEvent(new CustomEvent("bandkit:cart-state", { detail: {
          items: [{
            item_type: "t", item_id: 501, item_title: "Hyperfixated", unit_price: 3.5,
            currency: "AUD", quantity: 1,
            releases: [{ artist_name: "amwa", art_id: 987654321, item_art_url: "http://127.0.0.1:8765/assets/art-clouds.png", url: "https://amwa.bandcamp.com/track/hyperfixated" }]
          }],
          summary: { subtotal: 3.5, currency: "AUD" }
        } }));
        const cartCard = root?.querySelector(".hub-product-main");
        const art = cartCard?.querySelector(".hub-art");
        const artist = cartCard?.querySelector(".hub-track-artist");
        document.title = art?.src.includes("assets/art-clouds.png")
          && artist?.textContent === "amwa"
          && artist?.href === "https://amwa.bandcamp.com/"
          ? "PASS: single digital track cart artwork fixture"
          : `FAIL: single track cart ${art?.src || "no art"} / ${artist?.textContent || "no artist"}`;
        return;
      }
      if (location.search.includes("page-playlist-placement")) {
        const tools = document.querySelector(".inline_player > .bandcamp-hub-page-tools");
        const playerPlaylist = tools?.querySelector(".bandcamp-hub-page-playlist.is-player-control");
        const playerCart = tools?.querySelector(".bandcamp-hub-page-cart");
        const pageDj = tools?.querySelector(".bandcamp-hub-page-dj");
        const listActions = [...document.querySelectorAll(".track_row_view .bandcamp-hub-page-playlist.is-track-action")];
        const firstBuy = document.querySelector(".track_row_view .buy-link:not(.bandcamp-hub-page-playlist)");
        const hiddenOpacity = listActions[0] ? getComputedStyle(listActions[0]).opacity : "";
        listActions[0]?.focus();
        const focusedOpacity = listActions[0] ? getComputedStyle(listActions[0]).opacity : "";
        listActions[0]?.blur();
        root?.querySelector(".hub-close")?.click();
        const nativeHeaderCart = document.querySelector("#fixture-header-cart");
        const nativeHeaderCartSuppressed = nativeHeaderCart?.hidden
          && nativeHeaderCart.closest("li")?.hidden
          && getComputedStyle(nativeHeaderCart).display === "none";
        nativeHeaderCart?.click();
        const nativeHeaderCartWorks = !root?.querySelector(".hub-panel")?.classList.contains("is-hidden")
