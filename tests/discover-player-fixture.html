<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bandcamp Discover player fixture</title>
  <style>
    body { background: #202124; color: #fff; font-family: Arial, sans-serif; min-height: 100vh; }
    #DiscoverApp { height: 0; }
    .discover-app { min-height: 100vh; position: absolute; width: 100%; }
    #user-nav { display: flex; justify-content: flex-end; list-style: none; }
    .focused-result { margin: 80px; position: relative; }
    .focused-result > .play-pause-button { height: 64px; left: 16px; position: absolute; top: 300px; width: 64px; }
    .results-grid-item { list-style: none; margin: 20px 80px; width: 260px; }
    .results-grid-item .image-container { height: 260px; position: relative; width: 260px; }
    .results-grid-item .image-container img { height: 100%; width: 100%; }
    .results-grid-item .image-container > .play-pause-button { bottom: 16px; height: 34px; left: 16px; position: absolute; width: 34px; }
  </style>
</head>
<body>
  <ul id="user-nav"></ul>
  <div id="DiscoverApp"><div class="full-page-app-wrapper discover-app"><main class="app">
    <ul class="results-grid"><li class="results-grid-item"><div class="card">
      <div class="image-container"><img src="/tests/fixtures/assets/art-cobrastyle.png" alt=""><button class="g-button play-pause-button play-button" aria-label="Play">Play</button></div>
      <div class="content"><div class="header"><a class="stretch-link" href="https://grid-artist.bandcamp.com/album/grid-album"><div class="title">Grid Fixture Album</div><div class="attribution-meta">by Grid Fixture Artist</div></a></div></div>
    </div></li><li class="results-grid-item custom-domain-card"><div class="card">
      <div class="image-container"><img src="/tests/fixtures/assets/art-clouds.png" alt=""><button class="g-button play-pause-button play-button" aria-label="Play">Play</button></div>
      <div class="content"><div class="header"><a class="stretch-link" href="https://custom-label.example/album/custom-album"><div class="title">Custom Domain Album</div><div class="attribution-meta">by Custom Domain Artist</div></a></div></div>
    </div></li></ul>
    <button id="append-discover-results" type="button">Append Discover results</button>
    <div class="focused-result">
      <button class="g-button play-pause-button artwork-play-button" aria-label="Pause">Pause</button>
      <img src="/tests/fixtures/assets/art-clouds.png" alt="View Fixture Album">
      <div class="discover-player">
        <div class="player-top">
          <button class="g-button play-pause-button play-button" aria-label="Pause">Pause</button>
          <div class="player-info">
            <p class="title">Discover Fixture Track</p>
            <a href="https://fixture-artist.bandcamp.com/album/fixture-album">from Fixture Album</a>
            <a href="https://fixture-artist.bandcamp.com/">by Fixture Artist</a>
          </div>
        </div>
        <div class="player-bottom">
          <span class="playback-time current">00:24</span>
          <input type="range" min="0" max="1" step="0.001" value="0.133">
          <span class="playback-time total">03:00</span>
        </div>
      </div>
      <button id="simulate-next-track" type="button">Simulate next track</button>
    </div>
  </main></div></div>
  <script>
    const fixtureNativePlayerVisible = location.search.includes("native-visible");
    window.fixtureStored = location.search.includes("queue-to-discover-switch") ? { bandcampHubState: {
      open: true,
      activeTab: "nowPlaying",
      playlistMode: "manual",
      playlist: [{
        playlistItemId: "queued-before-discover",
        id: "queued-before-discover",
        title: "Queued Before Discover",
        artist: "Fixture",
        pageUrl: "https://fixture.bandcamp.com/track/queued-before-discover",
        duration: 150,
        url: "https://t4.bcbits.com/stream/queued-before-discover"
      }]
    } } : fixtureNativePlayerVisible ? { bandcampHubState: { appearance: { hideBandcampPlayer: false } } } : {};
    if (location.search.includes("appearance-reskin")) {
      window.fixtureStored = { bandcampHubState: {
        appearance: {
          pageAware: false,
          applyToPage: true,
          hideBandcampPlayer: true,
          preset: "midnight",
          savedThemes: []
        }
      } };
    }
    window.fixtureMessages = [];
    window.fixtureSeamlessState = { enabled: false, status: "idle" };
    const nativeControl = document.querySelector(".discover-player .play-pause-button");
    if (location.search.includes("queue-to-discover-switch")) {
      nativeControl.setAttribute("aria-label", "Play");
      nativeControl.textContent = "Play";
      document.querySelector(".focused-result > .artwork-play-button")?.setAttribute("aria-label", "Play");
    }
    document.querySelector("#simulate-next-track").addEventListener("click", () => {
      document.querySelector(".discover-player .player-info .title").textContent = "Second Live Fixture Track";
    });
    document.querySelector("#append-discover-results").addEventListener("click", () => {
      const grid = document.querySelector(".results-grid");
      const source = grid.querySelector(".results-grid-item");
      const fragment = document.createDocumentFragment();
      for (let index = 0; index < 80; index += 1) {
        const card = source.cloneNode(true);
        card.querySelectorAll(".bandcamp-hub-page-playlist").forEach((control) => control.remove());
        card.querySelectorAll("[data-bandkit-discover-action-scanned]").forEach((control) => control.removeAttribute("data-bandkit-discover-action-scanned"));
        card.querySelector(".title").textContent = `Stress Fixture Album ${index + 1}`;
        card.querySelector(".stretch-link").href = `https://stress-${index + 1}.bandcamp.com/album/stress-fixture`;
        fragment.append(card);
      }
      grid.append(fragment);
    });
    nativeControl.addEventListener("click", () => {
      const playing = nativeControl.getAttribute("aria-label") === "Pause";
      nativeControl.setAttribute("aria-label", playing ? "Play" : "Pause");
      nativeControl.textContent = playing ? "Play" : "Pause";
    });
    const fixtureChrome = {
      runtime: {
        lastError: null,
        getURL: (path) => new URL(`/dist/unpacked/${path}`, location.href).href,
        getManifest: () => ({ version: "0.5.14-section-button-unify" }),
        sendMessage(message, callback) {
          window.fixtureMessages.push(message);
          if (message.type === "BANDCAMP_HUB_GET_SEAMLESS_STATE") {
            callback?.({ ok: true, state: window.fixtureSeamlessState });
          } else if (message.type === "BANDCAMP_HUB_RESOLVE_PLAYLIST_ITEMS") {
            if (location.search.includes("rapid-switch")) {
              window.setTimeout(() => callback?.({ ok: true, items: message.items }), message.items[0]?.title === "Discover Fixture Track" ? 220 : 20);
            } else callback?.({ ok: true, items: message.items });
          } else if (message.type === "BANDCAMP_HUB_SEAMLESS_ENABLE") {
            const index = Math.max(0, Math.min(message.queue.length - 1, Number(message.index) || 0));
            window.fixtureSeamlessState = {
              enabled: true,
              status: "playing",
              isPlaying: true,
              currentTime: Number(message.currentTime) || 24,
              duration: Number(message.queue[index]?.duration) || 180,
              progress: (Number(message.currentTime) || 24) / (Number(message.queue[index]?.duration) || 180),
              rate: Number(message.rate) || 1,
              preservePitch: message.preservePitch !== false,
              filterValue: Number(message.filterValue) || 0,
              gainDb: Number(message.gainDb) || 0,
              waveform: [20, 60, 35, 80, 45, 70],
              detectedBpm: 124,
              automaticBpm: 124,
              bpmSource: "auto",
              bpmStatus: "ready",
              detectedKey: { camelot: "8A", shortName: "A min", name: "A minor" },
              index,
              track: message.queue[index],
              queue: message.queue
            };
            if (location.search.includes("queue-to-discover-switch") && message.queue[message.index]?.title === "Queued Before Discover") {
              window.setTimeout(() => callback?.({ ok: true, state: window.fixtureSeamlessState }), 220);
            } else callback?.({ ok: true, state: window.fixtureSeamlessState });
          } else if (message.type === "BANDCAMP_HUB_SEAMLESS_SEEK") {
            window.fixtureSeamlessState.currentTime = Number(message.currentTime) || 0;
            window.fixtureSeamlessState.progress = window.fixtureSeamlessState.currentTime / 180;
            callback?.({ ok: true, state: window.fixtureSeamlessState });
          } else callback?.({ ok: true, state: window.fixtureSeamlessState });
        },
        onMessage: { addListener() {} }
      },
      storage: {
        local: {
          get(_key, callback) { callback(window.fixtureStored); },
          set(values) { Object.assign(window.fixtureStored, values); }
        }
      }
    };
    Promise.all([
      fetch(`/dist/unpacked/page-media-bridge.js${location.search}`).then((response) => response.text()),
      fetch(`/dist/unpacked/cart-autosave.js${location.search}`).then((response) => response.text()).then((source) => eval(source)).then(() => fetch(`/dist/unpacked/content.js${location.search}`)).then((response) => response.text())
    ]).then(([bridgeSource, contentSource]) => {
      eval(bridgeSource);
      const hiddenDiscoverAudio = new Audio("https://bandcamp.com/stream_redirect?enc=mp3-128&track_id=12345");
      let hiddenDiscoverPaused = location.search.includes("queue-to-discover-switch");
      Object.defineProperties(hiddenDiscoverAudio, {
        paused: { get: () => hiddenDiscoverPaused },
        ended: { get: () => false },
        currentTime: { get: () => 24 },
        duration: { get: () => 180 }
      });
      eval(contentSource.replaceAll("chrome.", "fixtureChrome."));
      if (!location.search.includes("queue-to-discover-switch")) hiddenDiscoverAudio.dispatchEvent(new Event("playing"));
      if (location.search.includes("queue-to-discover-switch")) {
        window.setTimeout(() => {
          const root = document.querySelector("#bandcamp-hub-extension-root")?.querySelector("[data-bandcamp-hub]")?.shadowRoot;
          root?.querySelector(".hub-playlist-media-toggle")?.click();
          window.setTimeout(() => {
            hiddenDiscoverPaused = false;
            nativeControl.setAttribute("aria-label", "Play");
            nativeControl.textContent = "Play";
            nativeControl.click();
            hiddenDiscoverAudio.dispatchEvent(new Event("playing"));
          }, 100);
        }, 300);
      }
      if (location.search.includes("rapid-switch")) {
        window.setTimeout(() => {
          document.querySelector(".discover-player .player-info .title").textContent = "Second Discover Fixture Track";
          const links = document.querySelectorAll(".discover-player .player-info a");
          links[0].href = "https://second-discover.bandcamp.com/album/second-discover-album";
          links[0].textContent = "from Second Discover Album";
          links[1].href = "https://second-discover.bandcamp.com/";
          links[1].textContent = "by Second Discover Artist";
          document.querySelector(".results-grid-item .play-pause-button")?.click();
          hiddenDiscoverAudio.dispatchEvent(new Event("playing"));
        }, 20);
      }
    }).catch((error) => { document.documentElement.dataset.fixtureError = String(error); });
    window.setTimeout(() => {
      const root = document.querySelector("#bandcamp-hub-extension-root")?.querySelector("[data-bandcamp-hub]")?.shadowRoot;
      if (location.search.includes("rapid-switch") || location.search.includes("queue-to-discover-switch")) return;
      root?.querySelector(".hub-dj-player-button")?.click();
      root?.querySelector(".hub-dj-platter")?.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
      const scrub = root?.querySelector(".hub-scrub-slider");
      if (scrub) {
        scrub.value = "750";
        scrub.dispatchEvent(new Event("input", { bubbles: true }));
        scrub.dispatchEvent(new Event("change", { bubbles: true }));
      }
      if (location.search.includes("section-panel-resize")) {
        const panel = root?.querySelector(".hub-panel");
        const topHandle = panel?.querySelector(".hub-resize-handle.is-top");
        const rect = panel?.getBoundingClientRect();
        if (topHandle && rect) {
          const x = rect.left + rect.width / 2;
          topHandle.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, button: 0, pointerId: 41, clientX: x, clientY: rect.top + 4 }));
          topHandle.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, pointerId: 41, clientX: x, clientY: rect.top + 104 }));
          topHandle.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, pointerId: 41, clientX: x, clientY: rect.top + 104 }));
          root.querySelector('.hub-header-shortcut[data-tab="cart"]')?.click();
          document.documentElement.dataset.sectionPanelHeight = String(Math.round(panel.getBoundingClientRect().height));
        }
      }
    }, 1700);
    window.setTimeout(() => {
      const root = document.querySelector("#bandcamp-hub-extension-root")?.querySelector("[data-bandcamp-hub]")?.shadowRoot;
      if (location.search.includes("queue-to-discover-switch")) {
        const enables = window.fixtureMessages.filter((message) => message.type === "BANDCAMP_HUB_SEAMLESS_ENABLE");
        const finalTrack = window.fixtureSeamlessState.track;
        const queuedCard = root?.querySelector('[data-playlist-item-id="queued-before-discover"]');
        document.title = enables.length === 2
          && finalTrack?.title === "Discover Fixture Track"
          && !queuedCard?.querySelector(".hub-playlist-media-toggle")?.disabled
          ? "PASS: Discover click supersedes pending queue start fixture"
          : `FAIL: Discover supersession ${enables.length}/${finalTrack?.title || "none"}/${queuedCard?.querySelector(".hub-playlist-media-toggle")?.disabled}`;
        return;
      }
      if (location.search.includes("rapid-switch")) {
        const enabledMessages = window.fixtureMessages.filter((message) => message.type === "BANDCAMP_HUB_SEAMLESS_ENABLE");
        const activeTrack = enabledMessages.at(-1)?.queue?.[enabledMessages.at(-1)?.index || 0];
        document.title = enabledMessages.length === 1
          && activeTrack?.title === "Second Discover Fixture Track"
          && window.fixtureSeamlessState.track?.title === "Second Discover Fixture Track"
          && window.fixtureStored.bandcampHubState?.playlist?.length === 1
          && window.fixtureStored.bandcampHubState.playlist[0]?.title === "Second Discover Fixture Track"
          && window.fixtureStored.bandcampHubState.playlistMode === "browse"
          ? "PASS: rapid Discover switch keeps latest request fixture"
          : `FAIL: rapid Discover switch ${enabledMessages.length}/${activeTrack?.title || "none"}/${window.fixtureSeamlessState.track?.title || "none"}`;
        return;
      }
      const activity = window.fixtureStored.bandcampHubState?.activity || [];
      const title = root?.querySelector(".hub-player-title");
      const artist = root?.querySelector(".hub-player-artist");
      const playerHeight = Math.round(root?.querySelector(".hub-player")?.getBoundingClientRect().height || 0);
      const discoverSpacer = document.querySelector("#bandcamp-hub-discover-player-spacer");
      const detailReserve = Math.round(discoverSpacer?.getBoundingClientRect().height || 0);
      const detailScrollReserve = Math.round(parseFloat(getComputedStyle(document.querySelector(".focused-result")).scrollPaddingBottom) || 0);
      const discoverAddButton = document.querySelector(".focused-result > .bandcamp-hub-page-playlist.is-discover-add-to");
      const artworkPlayButton = document.querySelector(".focused-result > .artwork-play-button");
      const nativeDiscoverAddButton = document.querySelector(".focused-result .bandcamp-hub-page-playlist.is-discover-add-to");
      const nativeDiscoverPlayButton = document.querySelector(".discover-player .play-pause-button");
      const gridPlayButton = document.querySelector(".results-grid-item .play-pause-button");
      const gridAddButton = document.querySelector(".results-grid-item .bandcamp-hub-page-playlist.is-discover-add-to");
      const customDomainAddButton = document.querySelector(".custom-domain-card .bandcamp-hub-page-playlist.is-discover-add-to");
      const gridPlayStyle = getComputedStyle(gridPlayButton);
      const gridAddStyle = getComputedStyle(gridAddButton);
      document.title = title?.textContent === "Discover Fixture Track"
        && title.href.includes("fixture-artist.bandcamp.com/album/fixture-album")
        && artist?.textContent === "Fixture Artist"
        && (fixtureNativePlayerVisible
          ? getComputedStyle(document.querySelector(".discover-player")).display !== "none"
            && nativeDiscoverAddButton
            && nativeDiscoverAddButton.getBoundingClientRect().left > nativeDiscoverPlayButton.getBoundingClientRect().right
          : getComputedStyle(document.querySelector(".discover-player")).display === "none")
        && document.querySelector("#bandcamp-hub-player-spacer")?.parentElement === document.querySelector("#DiscoverApp main.app")
        && Math.round(document.querySelector("#bandcamp-hub-player-spacer")?.getBoundingClientRect().height || 0) === playerHeight
        && discoverSpacer?.parentElement === document.querySelector("#DiscoverApp .focused-result")
        && detailReserve === playerHeight + 16
        && detailScrollReserve === playerHeight + 16
        && gridAddButton?.getAttribute("aria-label") === "Add Grid Fixture Album to Now Playing or a playlist"
        && gridAddButton?.getBoundingClientRect().left > gridPlayButton?.getBoundingClientRect().right
        && Math.round(gridPlayButton?.getBoundingClientRect().width || 0) === 36
        && Math.round(gridAddButton?.getBoundingClientRect().width || 0) === 36
        && gridPlayStyle.borderRadius === gridAddStyle.borderRadius
        && gridAddStyle.borderRadius === "8px"
        && customDomainAddButton?.getAttribute("aria-label") === "Add Custom Domain Album to Now Playing or a playlist"
        && (fixtureNativePlayerVisible || (discoverAddButton?.getAttribute("aria-label")?.includes("Now Playing or a playlist")
          && discoverAddButton?.offsetLeft > artworkPlayButton?.offsetLeft + artworkPlayButton?.offsetWidth
          && Math.round(discoverAddButton?.getBoundingClientRect().width || 0) === 36))
        && root?.querySelector(".hub-duration")?.textContent === "3:00"
        && root?.querySelector(".hub-scrub-waveform-played")?.getAttribute("d")
        && root?.querySelector(".hub-scrub-control")?.style.getPropertyValue("--hub-scrub-progress") === "75.00%"
        && root?.querySelector(".hub-scrub-slider")?.getAttribute("aria-valuetext") === "2:15 of 3:00"
        && activity[0]?.title === "Discover Fixture Track"
        && root?.querySelector(".hub-dj-waveform")?.disabled === false
        && window.fixtureMessages.some((message) => message.type === "BANDCAMP_HUB_SEAMLESS_SCRATCH" && message.active === true)
        && window.fixtureMessages.some((message) => message.type === "BANDCAMP_HUB_SEAMLESS_SEEK" && Number(message.currentTime) === 135)
        ? "PASS: Bandcamp Discover player fixture"
        : `FAIL: ${title?.textContent || "no title"} / ${artist?.textContent || "no artist"} / ${root?.querySelector(".hub-duration")?.textContent || "no duration"} / ${activity[0]?.title || "no activity"} / waveform ${String(root?.querySelector(".hub-dj-waveform")?.disabled)} / seeks ${window.fixtureMessages.filter((message) => message.type === "BANDCAMP_HUB_SEAMLESS_SEEK").map((message) => message.currentTime).join(",")}`;
    }, 2300);
  </script>
</body>
</html>
