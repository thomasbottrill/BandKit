<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bandkit player layout fixture</title>
  <link rel="stylesheet" href="/dist/unpacked/hub.css">
  <style>
    body {
      --hub-accent: #1da0c3;
      --hub-accent-soft: rgba(236, 254, 255, 0.55);
      --hub-card: #fff;
      --hub-control-bg: #111827;
      --hub-control-border: #111827;
      --hub-control-fg: #fff;
      --hub-control-radius: 5px;
      --hub-ink: #111827;
      --hub-line: #e5e7eb;
      --hub-muted: #6b7280;
      --hub-panel: #fff;
      --hub-panel-accent: #1da0c3;
      --hub-panel-player-gap: 12px;
      --hub-player-height: 72px;
      --hub-scrub-accent: #087f9e;
      --hub-scrub-remaining: #cbd0d5;
      --hub-scrub-halo: rgba(17, 24, 39, 0.62);
      --hub-scrub-surface: #fff;
      background: #eef2f4;
      margin: 0;
      min-height: 100vh;
    }
    .fixture-page { color: #536065; font: 16px/1.5 Arial, sans-serif; margin: 48px; max-width: 720px; }
    .hub-panel { --hub-section-panel-height: 360px; }
    .hub-panel .hub-content { padding: 28px; }
    .hub-panel .hub-content h2 { margin: 0 0 12px; }
  </style>
</head>
<body>
  <main class="fixture-page">
    <h1>Bandcamp page fixture</h1>
    <p>The player and panel below exercise the extension’s playback layouts.</p>
  </main>
  <section class="hub-panel is-contextual" aria-label="Settings panel">
    <main class="hub-content">
      <h2>Settings</h2>
      <p>Playback, appearance, and layout options.</p>
    </main>
  </section>
  <script type="module">
    import { createMusicBar } from "/src/content/components/music-bar.js";
    import { createMusicBarShortcut } from "/src/content/components/section-navigation.js";
    globalThis.chrome = { runtime: { getURL: path => `/${path}` } };
    const { player, djDrawer, headerShortcuts, playerSections } = createMusicBar();
    document.body.append(player, djDrawer);
    player.classList.add("is-compact", "is-playing");
    Object.assign(player.dataset, { contentWidth: "default", playerStyle: "docked", visualizer: "glow" });
    const find = selector => player.querySelector(selector);
    find(".hub-player-art").src = "/tests/fixtures/assets/art-clouds.png";
    find(".hub-player-track").classList.remove("is-empty");
    find(".hub-player-title").textContent = "Pace & Space I";
    find(".hub-player-artist").textContent = "DJ Strawberry";
    for (const selector of [".hub-player-analysis", ".hub-player-bpm-badge", ".hub-player-key-badge"]) find(selector).hidden = false;
    find(".hub-player-bpm-badge").textContent = "124 BPM";
    find(".hub-player-key-name").textContent = "F min";
    find(".hub-player-key-camelot").textContent = "4A";
    find(".hub-scrub-slider").value = "820";
    find(".hub-scrub-control").style.setProperty("--hub-scrub-progress", "82%");
    find(".hub-current-time").textContent = "5:54";
    find(".hub-duration").textContent = "−1:06";
    const wave = Array.from({ length: 88 }, (_, i) => `M${i * 100 / 88} 12 v-${2 + (i * 7) % 10}`).join(" ");
    for (const path of player.querySelectorAll(".hub-scrub-waveform path")) path.setAttribute("d", wave);
    find(".hub-now-playing-count").textContent = "1";
    for (const [id, label, icon] of [["cart", "Cart", "icon-cart.svg"], ["activity", "Activity", "icon-activity.svg"], ["settings", "Settings", "icon-settings.svg"]]) {
      headerShortcuts.append(createMusicBarShortcut({ id, label, icon }));
    }
    playerSections.style.setProperty("--hub-sections-center-x", "1574px");
    playerSections.style.setProperty("--hub-sections-panel-width", "420px");
    const fixtureParams = new URLSearchParams(location.search);
    if (fixtureParams.get("mode") === "standard") {
      document.querySelector(".hub-player").classList.remove("is-compact");
      document.body.style.setProperty("--hub-player-height", "96px");
    }
    if (fixtureParams.get("style") === "floating") {
      document.querySelector(".hub-player").dataset.playerStyle = "floating";
    }
    const fixtureWidth = fixtureParams.get("width");
    if (["tight", "default", "wide", "full", "custom"].includes(fixtureWidth)) {
      document.querySelector(".hub-player").dataset.contentWidth = fixtureWidth;
    }
    const fixtureCustomWidth = Number(fixtureParams.get("custom"));
    if (fixtureCustomWidth) {
      document.querySelector(".hub-player").style.setProperty("--hub-player-custom-width", `${fixtureCustomWidth}px`);
    }
  </script>
</body>
</html>
