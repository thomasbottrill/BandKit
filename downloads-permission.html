<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allow Bandkit downloads</title>
  <link rel="stylesheet" href="downloads-permission.css">
</head>
<body>
  <main>
    <div class="window-copy">
      <h1>Save your Bandcamp downloads</h1>
      <p>Bandkit needs Chrome’s permission to save the files you choose and show their progress.</p>
    </div>
    <button id="allow" type="button">Allow downloads</button>
    <p id="status" class="window-copy" aria-live="polite"></p>
  </main>
  <script src="downloads-permission.js"></script>
</body>
</html>
